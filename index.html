<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel Prime</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #07090f;
      --surface: #0d1117;
      --surface2: #111827;
      --border: #1e2535;
      --accent: #a855f7;
      --green: #00ff88;
      --red: #ff3d5a;
      --text: #e2e8f0;
      --dim: #4a5568;
      --glow-purple: rgba(168,85,247,0.15);
      --glow-red: rgba(255,61,90,0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Exo 2', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grid de fundo sutil */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(168,85,247,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .container {
      position: relative; z-index: 1;
      max-width: 1800px;
      margin: 0 auto;
      padding: 18px 20px;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .logo span { color: var(--accent); }

    .header-status {
      display: flex; gap: 20px; align-items: center;
    }
    .status-pill {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 1px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .status-pill.live { color: var(--green); border-color: rgba(0,255,136,0.3); }
    .status-pill.live::before { content: '● '; }

    /* ── ROW PRINCIPAL: boss + tarefas ── */
    .main-row {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    /* ── ROW SECUNDÁRIA: demais módulos ── */
    .secondary-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── MÓDULO GENÉRICO ── */
    .module {
      /* background: var(--surface); */
      /* border: 1px solid var(--border); */
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .module::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
      opacity: 0.4;
    }

    .module.rpg-module::before {
      background: linear-gradient(90deg, transparent 0%, var(--red) 50%, transparent 100%);
    }

    /* ── CABEÇALHO DO MÓDULO ── */
    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 14px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--border);
    }

    .module-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dim);
    }

    .module-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ── BOTÃO TOGGLE ── */
    .toggle-btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1px solid var(--red);
      background: transparent;
      color: var(--red);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-btn:hover { background: var(--glow-red); }
    .toggle-btn.off { border-color: var(--green); color: var(--green); }
    .toggle-btn.off:hover { background: rgba(0,255,136,0.1); }

    /* ── IFRAME ── */
    .module-frame {
      width: 100%;
      border: none;
      display: block;
      transition: height 0.3s ease;
    }

    #frame-rpg    { height: 420px; }
    #frame-tarefas { height: 600px; }
    #frame-financas { height: 320px; }
    #frame-valorant { height: 460px; }
    #frame-futebol  { height: 460px; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.9);
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-box {
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 28px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 40px var(--glow-purple);
    }

    .modal-box h3 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .modal-box p { font-size: 0.75rem; color: var(--dim); margin-bottom: 16px; }

    .modal-box input {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 6px;
      font-family: 'Share Tech Mono', monospace;
      margin-bottom: 14px;
    }
    .modal-box input:focus { border-color: var(--accent); outline: none; }

    .modal-buttons { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1; padding: 10px; border: none; border-radius: 6px;
      font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    }
    .btn-confirm { background: var(--accent); color: #fff; }
    .btn-cancel  { background: var(--border); color: var(--dim); }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">PAINEL <span>PRIME</span></div>
    <div class="header-status">
      <span class="status-pill live">ONLINE</span>
      <span class="status-pill" id="clock">--:--</span>
    </div>
  </header>

  <!-- ROW PRINCIPAL: Boss (esquerda) + Tarefas (direita) -->
  <div class="main-row">
    <!-- BOSS -->
    <div class="module rpg-module" id="container-rpg">
      <div class="module-header">
        <span class="module-title">⚔ Boss Battle</span>
        <div class="module-controls">
          <button class="toggle-btn" onclick="controlePainel('rpg')">Desligar</button>
        </div>
      </div>
      <iframe src="./tasks/rpg_boss.html" class="module-frame" id="frame-rpg"></iframe>
    </div>

    <!-- TAREFAS -->
    <div class="module" id="container-tarefas">
      <div class="module-header">
        <span class="module-title">📋 Gerenciador de Tarefas</span>
        <div class="module-controls">
          <button class="toggle-btn" onclick="controlePainel('tarefas')">Desligar</button>
        </div>
      </div>
      <iframe src="./tasks/task/tarefas.html" class="module-frame" id="frame-tarefas"></iframe>
    </div>
  </div>

  <!-- ROW SECUNDÁRIA -->
  <div class="secondary-row">
    <div class="module" id="container-financas">
      <div class="module-header">
        <span class="module-title">💰 Fluxo Financeiro</span>
        <button class="toggle-btn" onclick="controlePainel('financas')">Desligar</button>
      </div>
      <iframe src="financas.html" class="module-frame" id="frame-financas"></iframe>
    </div>

    <div class="module" id="container-valorant">
      <div class="module-header">
        <span class="module-title">🎮 Estatísticas Valorant</span>
        <button class="toggle-btn" onclick="controlePainel('valorant')">Desligar</button>
      </div>
      <iframe src="valorant.html" class="module-frame" id="frame-valorant"></iframe>
    </div>

    <div class="module" id="container-futebol">
      <div class="module-header">
        <span class="module-title">⚽ Resultados Futebol</span>
        <button class="toggle-btn" onclick="controlePainel('futebol')">Desligar</button>
      </div>
      <iframe src="futebol.html" class="module-frame" id="frame-futebol"></iframe>
    </div>
  </div>
</div>

<!-- MODAL DE SENHA -->
<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h3>Acesso Restrito</h3>
    <p>Insira a credencial para ativar o painel</p>
    <input type="password" id="input-senha" placeholder="••••" maxlength="8"/>
    <div class="modal-buttons">
      <button class="modal-btn btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="modal-btn btn-confirm" onclick="validarSenha()">Confirmar</button>
    </div>
  </div>
</div>

<script>
  const SENHA_CORRETA = "08052021";
  let painelPendenteAtivacao = null;

  // Relógio
  function atualizarRelogio() {
    const agora = new Date();
    document.getElementById('clock').innerText =
      agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(atualizarRelogio, 1000);
  atualizarRelogio();

  // Mensagens dos iframes (resize + dano no boss)
  window.addEventListener('message', function(e) {
    // Resize de iframe
    if (e.data.height && e.data.id) {
      const frame = document.getElementById(e.data.id);
      if (frame && frame.style.display !== 'none') {
        frame.style.height = (e.data.height + 20) + 'px';
      }
    }

    // Tarefa concluída → propaga dano para o boss
    if (e.data.action === 'tarefaConcluida') {
      const frameBoss = document.getElementById('frame-rpg');
      if (frameBoss && frameBoss.style.display !== 'none') {
        frameBoss.contentWindow.postMessage({
          action: 'triggerDmg',
          dano: e.data.dano || 10
        }, '*');
      }
    }
  });

  function aplicarEstadoInicial() {
    ['tarefas','rpg','financas','valorant','futebol'].forEach(id => {
      if (localStorage.getItem(`painel-${id}`) === 'off') {
        const container = document.getElementById(`container-${id}`);
        const iframe    = document.getElementById(`frame-${id}`);
        const botao     = container.querySelector('.toggle-btn');
        iframe.style.display = 'none';
        iframe.style.height  = '0px';
        botao.textContent = 'Ligar';
        botao.classList.add('off');
      }
    });
  }

  function controlePainel(id) {
    const container = document.getElementById(`container-${id}`);
    const iframe    = document.getElementById(`frame-${id}`);
    const botao     = container.querySelector('.toggle-btn');

    if (iframe.style.display !== 'none') {
      iframe.dataset.antigaAltura = iframe.style.height;
      iframe.style.display = 'none';
      iframe.style.height  = '0px';
      botao.textContent = 'Ligar';
      botao.classList.add('off');
      localStorage.setItem(`painel-${id}`, 'off');
    } else {
      painelPendenteAtivacao = id;
      abrirModal();
    }
  }

  function abrirModal() {
    const input = document.getElementById('input-senha');
    input.value = '';
    document.getElementById('modal-senha').classList.add('active');
    input.focus();
  }

  function fecharModal() {
    document.getElementById('modal-senha').classList.remove('active');
    painelPendenteAtivacao = null;
  }

  function validarSenha() {
    const input = document.getElementById('input-senha');
    if (input.value === SENHA_CORRETA) {
      const id        = painelPendenteAtivacao;
      const container = document.getElementById(`container-${id}`);
      const iframe    = document.getElementById(`frame-${id}`);
      const botao     = container.querySelector('.toggle-btn');
      iframe.style.display = 'block';
      iframe.style.height  = iframe.dataset.antigaAltura || '420px';
      botao.textContent = 'Desligar';
      botao.classList.remove('off');
      localStorage.removeItem(`painel-${id}`);
      fecharModal();
    } else {
      alert('Senha incorreta!');
      input.value = '';
      input.focus();
    }
  }

  document.getElementById('input-senha').addEventListener('keyup', e => {
    if (e.key === 'Enter') validarSenha();
  });

  aplicarEstadoInicial();
</script>
</body>
</html>
