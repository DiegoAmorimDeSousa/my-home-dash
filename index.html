<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel Prime</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #07090f;
      --surface: #0d1117;
      --surface2: #111827;
      --border: #1e2535;
      --accent: #a855f7;
      --green: #00ff88;
      --red: #ff3d5a;
      --text: #e2e8f0;
      --dim: #4a5568;
      --glow-purple: rgba(168,85,247,0.15);
      --glow-red: rgba(255,61,90,0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Exo 2', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Grid de fundo sutil */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(168,85,247,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168,85,247,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── SCROLLBAR ESTILIZADA (página + modal) ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    * { scrollbar-width: thin; scrollbar-color: var(--border) var(--bg); }

    .container {
      position: relative; z-index: 1;
      max-width: 1800px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .logo span { color: var(--accent); }

    .header-status {
      display: flex; gap: 20px; align-items: center;
    }
    .status-pill {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 1px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .status-pill.live { color: var(--green); border-color: rgba(0,255,136,0.3); }
    .status-pill.live::before { content: '● '; }

    /* ── FILEIRA ÚNICA: 3 colunas (Tarefas+Boss / Financeiro / Valorant) ── */
    .dashboard-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: stretch;
      flex: 1;
      min-height: 0;
    }

    @media (max-width: 1300px) {
      .dashboard-row { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 700px) {
      body { overflow-y: auto; }
      .container { flex: none; }
      .dashboard-row { grid-template-columns: 1fr; flex: none; align-items: stretch; }
      .module { min-height: 380px; }
    }

    /* ── MÓDULO GENÉRICO ── */
    .module {
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .module::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
      opacity: 0.4;
    }

    .module.rpg-module::before {
      background: linear-gradient(90deg, transparent 0%, var(--red) 50%, transparent 100%);
    }

    /* ── CABEÇALHO DO MÓDULO ── */
    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 14px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .module-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dim);
    }

    .module-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ── BOTÃO TOGGLE ── */
    .toggle-btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1px solid var(--red);
      background: transparent;
      color: var(--red);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-btn:hover { background: var(--glow-red); }
    .toggle-btn.off { border-color: var(--green); color: var(--green); }
    .toggle-btn.off:hover { background: rgba(0,255,136,0.1); }

    /* ── IFRAME ── */
    .module-frame {
      width: 100%;
      border: none;
      display: block;
      flex: 1;
      min-height: 0;
    }

    /* ── PILHA BOSS + TAREFAS (mesma coluna) ── */
    .tarefas-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      flex: 1;
      min-height: 0;
    }
    .sub-frame {
      width: 100%;
      border: none;
      display: block;
      border-radius: 6px;
      overflow: hidden;
    }
    .boss-frame  { flex: 0 0 150px; }
    .tasks-frame { flex: 1; min-height: 0; }

    /* ── BOTÃO EXPANDIR ── */
    .expand-btn {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      padding: 3px 8px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1;
    }
    .expand-btn:hover { background: var(--glow-purple); }

    /* ── MODAL DE EXPANSÃO ── */
    .expand-box {
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: 10px;
      width: min(1100px, 92vw);
      max-height: 90vh;
      box-shadow: 0 0 60px var(--glow-purple);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .expand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .expand-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
    }
    .expand-close {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dim);
      border-radius: 4px;
      width: 26px; height: 26px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .expand-close:hover { border-color: var(--red); color: var(--red); }
    .expand-body {
      flex: 1;
      overflow-y: auto;
      min-height: 200px;
    }
    .expand-iframe {
      width: 100%;
      border: none;
      display: block;
      min-height: 400px;
    }
    .expand-iframe + .expand-iframe {
      border-top: 1px solid var(--border);
    }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.9);
      display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-box {
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 28px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 40px var(--glow-purple);
    }

    .modal-box h3 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .modal-box p { font-size: 0.75rem; color: var(--dim); margin-bottom: 16px; }

    .modal-box input {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 6px;
      font-family: 'Share Tech Mono', monospace;
      margin-bottom: 14px;
    }
    .modal-box input:focus { border-color: var(--accent); outline: none; }

    .modal-buttons { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1; padding: 10px; border: none; border-radius: 6px;
      font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    }
    .btn-confirm { background: var(--accent); color: #fff; }
    .btn-cancel  { background: var(--border); color: var(--dim); }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">PAINEL <span>PRIME</span></div>
    <div class="header-status">
      <span class="status-pill live">ONLINE</span>
      <span class="status-pill" id="clock">--:--</span>
    </div>
  </header>

  <!-- FILEIRA ÚNICA: Tarefas (+Boss) / Financeiro / Valorant / Futebol -->
  <div class="dashboard-row">
    <!-- TAREFAS + BOSS (mesma coluna) -->
    <div class="module rpg-module" id="container-tarefasgroup">
      <div class="module-header">
        <span class="module-title">📋 Tarefas</span>
        <div class="module-controls">
          <button class="expand-btn" onclick="expandTarefas()">⤢ Expandir</button>
          <button class="toggle-btn" onclick="controlePainel('tarefasgroup')">Desligar</button>
        </div>
      </div>
      <div class="tarefas-stack">
        <iframe src="./tasks/rpg_boss.html?compact=1" class="sub-frame boss-frame" id="frame-rpg"></iframe>
        <iframe src="./tasks/task/tarefas.html?compact=1" class="sub-frame tasks-frame" id="frame-tarefas"></iframe>
      </div>
    </div>

    <!-- FINANCEIRO -->
    <div class="module" id="container-financas">
      <div class="module-header">
        <span class="module-title">💰 Financeiro</span>
        <div class="module-controls">
          <button class="expand-btn" onclick="expandModule('financas','financas.html','💰 Fluxo Financeiro')">⤢ Expandir</button>
          <button class="toggle-btn" onclick="controlePainel('financas')">Desligar</button>
        </div>
      </div>
      <iframe src="financas.html?compact=1" class="module-frame" id="frame-financas"></iframe>
    </div>

    <!-- VALORANT -->
    <!-- <div class="module" id="container-valorant">
      <div class="module-header">
        <span class="module-title">🎮 Tabela Valorant</span>
        <div class="module-controls">
          <button class="expand-btn" onclick="expandModule('valorant','./valorant/valorant.html','🎮 Estatísticas Valorant')">⤢ Expandir</button>
          <button class="toggle-btn" onclick="controlePainel('valorant')">Desligar</button>
        </div>
      </div>
      <iframe src="./valorant/valorant.html?compact=1" class="module-frame" id="frame-valorant"></iframe>
    </div> -->

    <!-- FUTEBOL -->
    <div class="module" id="container-futebol">
      <div class="module-header">
        <span class="module-title">⚽ Tabela Futebol</span>
        <div class="module-controls">
          <button class="expand-btn" onclick="expandModule('futebol','futebol.html','⚽ Resultados Futebol')">⤢ Expandir</button>
          <button class="toggle-btn" onclick="controlePainel('futebol')">Desligar</button>
        </div>
      </div>
      <iframe src="futebol.html?compact=1" class="module-frame" id="frame-futebol"></iframe>
    </div>
  </div>
</div>

<!-- MODAL DE EXPANSÃO -->
<div class="modal-overlay" id="modal-expand">
  <div class="expand-box">
    <div class="expand-header">
      <span class="expand-title" id="expand-title">Módulo</span>
      <button class="expand-close" onclick="fecharExpandido()">✕</button>
    </div>
    <div class="expand-body" id="expand-body">
      <iframe id="modal-frame" class="expand-iframe" src="about:blank"></iframe>
      <iframe id="modal-frame-2" class="expand-iframe" src="about:blank" style="display:none;"></iframe>
    </div>
  </div>
</div>

<!-- MODAL DE SENHA -->
<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h3>Acesso Restrito</h3>
    <p>Insira a credencial para ativar o painel</p>
    <input type="password" id="input-senha" placeholder="••••" maxlength="8"/>
    <div class="modal-buttons">
      <button class="modal-btn btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="modal-btn btn-confirm" onclick="validarSenha()">Confirmar</button>
    </div>
  </div>
</div>

<script>
  const SENHA_CORRETA = "08052021";
  let painelPendenteAtivacao = null;

  // Relógio
  function atualizarRelogio() {
    const agora = new Date();
    document.getElementById('clock').innerText =
      agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(atualizarRelogio, 1000);
  atualizarRelogio();

  // Mensagens dos iframes (resize do modal + estado do boss)
  window.addEventListener('message', function(e) {
    // Resize dinâmico SÓ para os iframes do modal expandido — os cards
    // compactos ficam com altura fixa via CSS pra manter as 4 colunas uniformes.
    if (e.data.height && (e.data.id === 'modal-frame' || e.data.id === 'modal-frame-2')) {
      const frame = document.getElementById(e.data.id);
      if (frame && frame.style.display !== 'none') {
        frame.style.height = (e.data.height + 20) + 'px';
      }
    }

    // Tarefas gravou algo novo no localStorage local → avisa QUALQUER iframe
    // que esteja mostrando o boss pra ele reler o estado e se re-renderizar
    // (o card compacto "frame-rpg" e, se estiver aberto, o modal expandido).
    // Nenhum valor de dano trafega mais entre iframes — todos leem o mesmo
    // localStorage (mesma origem), a mensagem é só um "ping" pra atualizar na hora.
    if (e.data.action === 'bossStateChanged') {
      document.querySelectorAll('iframe').forEach(f => {
        if (f.src && f.src.includes('rpg_boss.html') && f.style.display !== 'none') {
          f.contentWindow.postMessage({ action: 'bossStateChanged' }, '*');
        }
      });
    }

    // Mesma lógica pra tarefas: se o modal expandido criar/excluir uma
    // tarefa, o card compacto (e vice-versa) precisa saber pra redesenhar.
    if (e.data.action === 'tasksChanged') {
      document.querySelectorAll('iframe').forEach(f => {
        if (f.src && f.src.includes('tarefas.html') && f.style.display !== 'none') {
          f.contentWindow.postMessage({ action: 'tasksChanged' }, '*');
        }
      });
    }
  });

  // ── EXPANDIR / FECHAR MODAL ──
  function expandModule(id, url, titulo) {
    document.getElementById('expand-title').innerText = titulo;
    const f2 = document.getElementById('modal-frame-2');
    f2.style.display = 'none';
    f2.src = 'about:blank';

    const iframe = document.getElementById('modal-frame');
    iframe.style.height = '400px';
    const sep = url.includes('?') ? '&' : '?';
    iframe.src = url + sep + 'frameId=modal-frame';
    document.getElementById('modal-expand').classList.add('active');
  }

  // Caso especial: Tarefas mostra Boss + Checklist completos empilhados no modal
  function expandTarefas() {
    document.getElementById('expand-title').innerText = '📋 Tarefas & Boss';

    const f1 = document.getElementById('modal-frame');
    f1.style.height = '420px';
    f1.src = './tasks/rpg_boss.html?frameId=modal-frame';

    const f2 = document.getElementById('modal-frame-2');
    f2.style.display = 'block';
    f2.style.height = '400px';
    f2.src = './tasks/task/tarefas.html?frameId=modal-frame-2';

    document.getElementById('modal-expand').classList.add('active');
  }

  function fecharExpandido() {
    document.getElementById('modal-expand').classList.remove('active');
    document.getElementById('modal-frame').src = 'about:blank';
    const f2 = document.getElementById('modal-frame-2');
    f2.src = 'about:blank';
    f2.style.display = 'none';
  }

  // ── LIGAR / DESLIGAR PAINÉIS (suporta grupos com mais de 1 iframe) ──
  const PAINEIS = {
    tarefasgroup: { container: 'container-tarefasgroup', frames: ['frame-rpg', 'frame-tarefas'] },
    financas:     { container: 'container-financas',     frames: ['frame-financas'] },
    valorant:     { container: 'container-valorant',     frames: ['frame-valorant'] },
    futebol:      { container: 'container-futebol',      frames: ['frame-futebol'] },
  };

  function aplicarEstadoInicial() {
    Object.keys(PAINEIS).forEach(id => {
      if (localStorage.getItem(`painel-${id}`) === 'off') {
        const cfg = PAINEIS[id];
        const container = document.getElementById(cfg.container);
        const botao = container.querySelector('.toggle-btn');
        cfg.frames.forEach(fid => { document.getElementById(fid).style.display = 'none'; });
        botao.textContent = 'Ligar';
        botao.classList.add('off');
      }
    });
  }

  function controlePainel(id) {
    const cfg = PAINEIS[id];
    const container = document.getElementById(cfg.container);
    const botao = container.querySelector('.toggle-btn');
    const primeiraFrame = document.getElementById(cfg.frames[0]);

    if (primeiraFrame.style.display !== 'none') {
      cfg.frames.forEach(fid => { document.getElementById(fid).style.display = 'none'; });
      botao.textContent = 'Ligar';
      botao.classList.add('off');
      localStorage.setItem(`painel-${id}`, 'off');
    } else {
      painelPendenteAtivacao = id;
      abrirModal();
    }
  }

  function abrirModal() {
    const input = document.getElementById('input-senha');
    input.value = '';
    document.getElementById('modal-senha').classList.add('active');
    input.focus();
  }

  function fecharModal() {
    document.getElementById('modal-senha').classList.remove('active');
    painelPendenteAtivacao = null;
  }

  function validarSenha() {
    const input = document.getElementById('input-senha');
    if (input.value === SENHA_CORRETA) {
      const id  = painelPendenteAtivacao;
      const cfg = PAINEIS[id];
      const container = document.getElementById(cfg.container);
      const botao = container.querySelector('.toggle-btn');
      cfg.frames.forEach(fid => { document.getElementById(fid).style.display = 'block'; });
      botao.textContent = 'Desligar';
      botao.classList.remove('off');
      localStorage.removeItem(`painel-${id}`);
      fecharModal();
    } else {
      alert('Senha incorreta!');
      input.value = '';
      input.focus();
    }
  }

  document.getElementById('input-senha').addEventListener('keyup', e => {
    if (e.key === 'Enter') validarSenha();
  });

  aplicarEstadoInicial();
</script>
</body>
</html>
