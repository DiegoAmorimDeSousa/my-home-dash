<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel Prime</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="painel/painel.css"/>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">PAINEL <span>PRIME</span></div>
    <div class="header-status">
      <span class="status-pill live">ONLINE</span>
      <span class="status-pill" id="clock">--:--</span>
    </div>
  </header>

  <!-- FILEIRA ÚNICA: Tarefas (+Boss) / Financeiro / Valorant / Futebol -->
  <div class="dashboard-row">
    <!-- TAREFAS + BOSS (mesma coluna) -->
    <div class="module rpg-module" id="container-tarefasgroup">
      <div class="module-header">
        <span class="module-title">📋 Tarefas</span>
        <div class="module-controls">
          <button class="expand-btn" onclick="expandTarefas()">⤢ Expandir</button>
          <button class="toggle-btn" onclick="controlePainel('tarefasgroup')">Desligar</button>
        </div>
      </div>
      <div class="tarefas-stack">
        <iframe src="modulos/tarefas/boss.html?compact=1" class="sub-frame boss-frame" id="frame-rpg"></iframe>
        <iframe src="modulos/tarefas/tarefas.html?compact=1" class="sub-frame tasks-frame" id="frame-tarefas"></iframe>
      </div>
    </div>

    <!-- FINANCEIRO -->
    <div class="module" id="container-financas">
      <div class="module-header">
        <span class="module-title">💰 Financeiro</span>
        <div class="module-controls">
          <button class="expand-btn" onclick="expandModule('financas','modulos/financas/financas.html','💰 Fluxo Financeiro')">⤢ Expandir</button>
          <button class="toggle-btn" onclick="controlePainel('financas')">Desligar</button>
        </div>
      </div>
      <iframe src="modulos/financas/financas.html?compact=1" class="module-frame" id="frame-financas"></iframe>
    </div>

    <!-- VALORANT — desativado (aguardando fonte de dados confiável).
         Pra reativar: descomenta esse bloco, volta o grid .dashboard-row
         pra repeat(4, 1fr) e descomenta a linha do valorant em PAINEIS.
    <div class="module" id="container-valorant">
      <div class="module-header">
        <span class="module-title">🎮 Tabela Valorant</span>
        <div class="module-controls">
          <button class="expand-btn" onclick="expandModule('valorant','modulos/valorant/valorant.html','🎮 Estatísticas Valorant')">⤢ Expandir</button>
          <button class="toggle-btn" onclick="controlePainel('valorant')">Desligar</button>
        </div>
      </div>
      <iframe src="modulos/valorant/valorant.html?compact=1" class="module-frame" id="frame-valorant"></iframe>
    </div>
    -->

    <!-- FUTEBOL -->
    <div class="module" id="container-futebol">
      <div class="module-header">
        <span class="module-title">⚽ Tabela Futebol</span>
        <div class="module-controls">
          <button class="expand-btn" onclick="expandModule('futebol','modulos/futebol/futebol.html','⚽ Resultados Futebol')">⤢ Expandir</button>
          <button class="toggle-btn" onclick="controlePainel('futebol')">Desligar</button>
        </div>
      </div>
      <iframe src="modulos/futebol/futebol.html?compact=1" class="module-frame" id="frame-futebol"></iframe>
    </div>
  </div>
</div>

<!-- MODAL DE EXPANSÃO -->
<div class="modal-overlay" id="modal-expand">
  <div class="expand-box">
    <div class="expand-header">
      <span class="expand-title" id="expand-title">Módulo</span>
      <button class="expand-close" onclick="fecharExpandido()">✕</button>
    </div>
    <div class="expand-body" id="expand-body">
      <iframe id="modal-frame" class="expand-iframe" src="about:blank"></iframe>
      <iframe id="modal-frame-2" class="expand-iframe" src="about:blank" style="display:none;"></iframe>
    </div>
  </div>
</div>

<!-- MODAL DE SENHA -->
<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h3>Acesso Restrito</h3>
    <p>Insira a credencial para ativar o painel</p>
    <input type="password" id="input-senha" placeholder="••••" maxlength="8"/>
    <div class="modal-buttons">
      <button class="modal-btn btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="modal-btn btn-confirm" onclick="validarSenha()">Confirmar</button>
    </div>
  </div>
</div>

<script src="painel/painel.js"></script>
</body>
</html>
