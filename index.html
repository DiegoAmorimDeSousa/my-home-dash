<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <title>Painel Prime - Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0e14;
        --purple: #a855f7;
        --text: #ffffff;
        --panel-bg: rgba(24, 30, 38, 0.6);
        --border-color: #232d38;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        overflow-y: auto;
      }
      .container {
        max-width: 1600px;
        margin: 0 auto;
      }
      header {
        margin-bottom: 20px;
      }
      header h1 {
        font-family: "Montserrat";
        font-size: 1.8rem;
        margin: 0;
      }

      .grid-main {
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      /* 📦 CONTAINER DO MÓDULO (Agrupa o topo de controle + o iframe) */
      .module-container {
        background-color: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
      }

      /* 🕹️ BARRA DE CONTROLE SUPERIOR DE CADA PAINEL */
      .module-header {
        background-color: rgba(0, 0, 0, 0.4);
        padding: 10px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
      }

      .module-title {
        font-family: "Montserrat", sans-serif;
        font-size: 0.9rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #a0a5b5;
      }

      /* 🔘 BOTÃO LIGAR / DESLIGAR */
      .toggle-btn {
        background-color: #ff4655; /* Vermelho padrão para Desligar */
        color: white;
        border: none;
        padding: 6px 12px;
        font-size: 0.75rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .toggle-btn:hover {
        opacity: 0.9;
      }

      /* Estado do botão quando o painel está desligado */
      .toggle-btn.off {
        background-color: #00ff87; /* Verde para indicar que pode Ligar */
        color: #0b0e14;
      }

      .module-frame {
        width: 100%;
        border: none;
        display: block;
        transition: height 0.3s ease;
      }

      /* Alturas mínimas iniciais */
      #frame-tarefas {
        min-height: 200px;
      }
      #frame-financas {
        min-height: 300px;
      }
      #frame-valorant {
        min-height: 450px;
      }
      #frame-futebol {
        min-height: 450px;
      }

      /* 🔒 MODAL DE SENHA ESCURO */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }

      .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-box {
        background: #141b24;
        border: 1px solid #ff4655;
        padding: 25px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 0 20px rgba(255, 70, 85, 0.2);
        max-width: 320px;
        width: 100%;
      }

      .modal-box h3 {
        margin-top: 0;
        font-family: "Montserrat", sans-serif;
        font-size: 1.1rem;
        letter-spacing: 1px;
      }

      .modal-box input {
        width: 100%;
        padding: 10px;
        margin: 15px 0;
        background: #0b0e14;
        border: 1px solid var(--border-color);
        color: white;
        border-radius: 4px;
        text-align: center;
        font-size: 1.1rem;
        letter-spacing: 4px;
        box-sizing: border-box;
      }

      .modal-box input:focus {
        border-color: #ff4655;
        outline: none;
      }

      .modal-buttons {
        display: flex;
        gap: 10px;
      }

      .modal-btn {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      .btn-confirm {
        background: #00ff87;
        color: #0b0e14;
      }

      .btn-cancel {
        background: #232d38;
        color: #a0a5b5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>PAINEL <span style="color: var(--purple)">PRIME</span></h1>
      </header>

      <div class="grid-main">
        <div class="module-container" id="container-tarefas">
          <div class="module-header">
            <span class="module-title">Gerenciador de Tarefas</span>
            <button class="toggle-btn" onclick="controlePainel('tarefas')">
              Desligar
            </button>
          </div>
          <iframe
            src="tarefas.html"
            class="module-frame"
            id="frame-tarefas"
          ></iframe>
        </div>

        <div class="module-container" id="container-financas">
          <div class="module-header">
            <span class="module-title">Fluxo Financeiro</span>
            <button class="toggle-btn" onclick="controlePainel('financas')">
              Desligar
            </button>
          </div>
          <iframe
            src="financas.html"
            class="module-frame"
            id="frame-financas"
          ></iframe>
        </div>

        <div class="module-container" id="container-valorant">
          <div class="module-header">
            <span class="module-title">Estatísticas Valorant</span>
            <button class="toggle-btn" onclick="controlePainel('valorant')">
              Desligar
            </button>
          </div>
          <iframe
            src="valorant.html"
            class="module-frame"
            id="frame-valorant"
          ></iframe>
        </div>

        <div class="module-container" id="container-futebol">
          <div class="module-header">
            <span class="module-title">Resultados Futebol</span>
            <button class="toggle-btn" onclick="controlePainel('futebol')">
              Desligar
            </button>
          </div>
          <iframe
            src="futebol.html"
            class="module-frame"
            id="frame-futebol"
          ></iframe>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="modal-senha">
      <div class="modal-box">
        <h3>Acesso Restrito</h3>
        <p style="font-size: 0.8rem; color: #888; margin: 0">
          Insira a credencial para ativar o painel
        </p>
        <input
          type="password"
          id="input-senha"
          placeholder="••••"
          maxlength="8"
        />
        <div class="modal-buttons">
          <button class="modal-btn btn-cancel" onclick="fecharModal()">
            Cancelar
          </button>
          <button class="modal-btn btn-confirm" onclick="validarSenha()">
            Confirmar
          </button>
        </div>
      </div>
    </div>

    <script>
      const SENHA_CORRETA = "08052021"; // 🔑 Altere aqui a sua senha de ativação
      let painelPendenteAtivacao = null;

      // Ouvinte de mensagens para redimensionamento do Iframe
      window.addEventListener(
        "message",
        function (e) {
          if (e.data.height && e.data.id) {
            var frame = document.getElementById(e.data.id);
            if (frame && frame.style.display !== "none") {
              frame.style.height = e.data.height + 30 + "px";
            }
          }
        },
        false,
      );

      // 💾 FUNÇÃO EXECUTADA AO CARREGAR A PÁGINA (Verifica o que estava desligado)
      function aplicarEstadoInicial() {
        const paineis = ["tarefas", "financas", "valorant", "futebol"];

        paineis.forEach((id) => {
          // Procura se o navegador salvou que esse painel devia estar "off"
          const estadoSalvo = localStorage.getItem(`painel-${id}`);

          if (estadoSalvo === "off") {
            const container = document.getElementById(`container-${id}`);
            const iframe = document.getElementById(`frame-${id}`);
            const botao = container.querySelector(".toggle-btn");

            iframe.style.display = "none";
            botao.textContent = "Ligar";
            botao.classList.add("off");
            iframe.style.height = "0px";
          }
        });
      }

      // Função mestra de ligar / desligar
      function controlePainel(idPainel) {
        const container = document.getElementById(`container-${idPainel}`);
        const iframe = document.getElementById(`frame-${idPainel}`);
        const botao = container.querySelector(".toggle-btn");

        if (iframe.style.display !== "none") {
          // 🔴 DESLIGAR: Salva o estado "off" no navegador para o F5 não resetar
          iframe.style.display = "none";
          botao.textContent = "Ligar";
          botao.classList.add("off");

          iframe.dataset.antigaAltura = iframe.style.height;
          iframe.style.height = "0px";

          localStorage.setItem(`painel-${idPainel}`, "off"); // Guardou na memória
        } else {
          // 🟢 LIGAR: Abre o modal para pedir a credencial
          painelPendenteAtivacao = idPainel;
          abrirModal();
        }
      }

      function abrirModal() {
        const modal = document.getElementById("modal-senha");
        const input = document.getElementById("input-senha");
        input.value = "";
        modal.classList.add("active");
        input.focus();
      }

      function fecharModal() {
        document.getElementById("modal-senha").classList.remove("active");
        painelPendenteAtivacao = null;
      }

      function validarSenha() {
        const input = document.getElementById("input-senha");

        if (input.value === SENHA_CORRETA) {
          const id = painelPendenteAtivacao;
          const container = document.getElementById(`container-${id}`);
          const iframe = document.getElementById(`frame-${id}`);
          const botao = container.querySelector(".toggle-btn");

          iframe.style.display = "block";
          iframe.style.height = iframe.dataset.antigaAltura || "450px";
          botao.textContent = "Desligar";
          botao.classList.remove("off");

          // Limpa a memória para que ele nasça ligado no próximo F5
          localStorage.removeItem(`painel-${id}`);

          fecharModal();

          setTimeout(() => {
            window.dispatchEvent(new Event("resize"));
          }, 100);
        } else {
          alert("Senha incorreta! Acesso negado.");
          input.value = "";
          input.focus();
        }
      }

      document
        .getElementById("input-senha")
        .addEventListener("keyup", function (event) {
          if (event.key === "Enter") {
            validarSenha();
          }
        });

      // Executa a checagem assim que a página abre
      aplicarEstadoInicial();
    </script>
  </body>
</html>
