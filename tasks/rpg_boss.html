<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  background: #07090f;
}

body {
  width: 100%;
  min-height: 420px;
  overflow: hidden;
  background: #07090f;
  font-family: 'Press Start 2P', monospace;
}

/* ── ARENA ocupa tudo ── */
.arena {
  position: relative;
  width: 100%;
  height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #07090f;
}

/* Grade de fundo */
.arena::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 50%, rgba(160,0,0,0.2) 0%, transparent 60%),
    repeating-linear-gradient(0deg,   transparent 0px, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
    repeating-linear-gradient(90deg,  transparent 0px, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
    linear-gradient(180deg, #0d0f1a 0%, #07090f 100%);
  z-index: 0;
}
/* Vinheta */
.arena::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.75) 100%);
  z-index: 1; pointer-events: none;
}

/* Bordas vermelhas */
.wall { position: absolute; z-index: 2; }
.wall-top    { top:0;    left:0; right:0;  height:2px; background: linear-gradient(90deg, transparent, #cc2222 50%, transparent); opacity:0.6; }
.wall-bottom { bottom:0; left:0; right:0;  height:2px; background: linear-gradient(90deg, transparent, #cc2222 50%, transparent); opacity:0.6; }
.wall-left   { top:0; bottom:0; left:0;   width:2px;  background: linear-gradient(180deg, transparent, #cc2222 50%, transparent); opacity:0.6; }
.wall-right  { top:0; bottom:0; right:0;  width:2px;  background: linear-gradient(180deg, transparent, #cc2222 50%, transparent); opacity:0.6; }

/* ── LAYOUT: sprite esquerda | HUD direita — ocupa toda a largura ── */
.battle-layout {
  position: relative; z-index: 10;
  display: flex;
  align-items: center;
  width: 100%;
  height: 100%;
  padding: 0 18px;
  gap: 0;
}

/* ── COLUNA DO SPRITE ── */
.boss-col {
  flex: 0 0 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

.boss-sprite {
  width: 140px; height: 140px;
  image-rendering: pixelated;
  filter: drop-shadow(0 0 24px rgba(255,50,50,0.6));
  animation: bossFloat 2.8s ease-in-out infinite;
  display: block;
}
@keyframes bossFloat {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}

.boss-shadow {
  width: 80px; height: 14px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.7) 0%, transparent 80%);
  border-radius: 50%; filter: blur(3px); margin-top: -2px;
  transition: opacity 0.4s;
}

.boss-aura {
  position: absolute;
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(200,0,0,0.22) 0%, transparent 70%);
  animation: auraPulse 2.2s ease-in-out infinite;
  top: 50%; left: 50%;
  transform: translate(-50%, -66%);
  z-index: -1;
}
@keyframes auraPulse {
  0%,100% { transform: translate(-50%,-66%) scale(1); opacity:0.5; }
  50%      { transform: translate(-50%,-66%) scale(1.3); opacity:1; }
}

/* ── HUD PANEL: ocupa o resto ── */
.hud-panel {
  flex: 1;
  min-width: 0; /* evita overflow */
  background: rgba(6,8,16,0.88);
  border: 1px solid #1e2235;
  border-left: none;
  border-radius: 0 8px 8px 0;
  padding: 16px 18px 14px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 0 30px rgba(0,0,0,0.7);
  position: relative; overflow: hidden;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.hud-panel::before {
  content: '';
  position: absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent, #cc2222, transparent);
}

.hud-room {
  font-family: 'VT323', monospace;
  font-size: 13px; color: #3a4060;
  letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px;
}
.hud-name {
  font-size: 15px; color: #ff4444; letter-spacing: 2px;
  text-shadow: 0 0 14px rgba(255,50,50,0.7);
  text-transform: uppercase; margin-bottom: 12px; line-height: 1.3;
  word-break: break-word;
}

/* HP */
.hp-track {
  height: 10px; background: #0a0b12;
  border: 1px solid #1a1d2e; border-radius: 2px;
  overflow: visible; position: relative; margin-bottom: 5px;
}
.hp-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, #cc1111, #ff4444);
  box-shadow: 0 0 7px rgba(255,50,50,0.6);
  transition: width 0.85s cubic-bezier(0.25,0.46,0.45,0.94);
  position: relative; overflow: hidden;
}
.hp-fill::after {
  content:''; position:absolute; top:0; left:-60%; width:50%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.22),transparent);
  animation:hpShine 3s infinite;
}
@keyframes hpShine {
  0%{left:-60%;opacity:0} 20%{opacity:1} 60%{left:120%;opacity:0} 100%{left:120%;opacity:0}
}
.hp-pending {
  position:absolute; top:0; right:0; height:100%;
  background:rgba(255,140,0,0.4); border-radius:2px;
  transition:width 0.3s ease;
}
.hp-row {
  display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;
}
.hp-current { font-family:'VT323',monospace; font-size:22px; color:#ff6060; line-height:1; }
.hp-max     { font-family:'VT323',monospace; font-size:15px; color:#3a4060; }

/* Badges */
.type-row { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px; }
.type-badge {
  font-family:'VT323',monospace; font-size:12px;
  padding:2px 8px; border-radius:2px; letter-spacing:1px;
  text-transform:uppercase; font-weight:bold;
}

/* Info chips */
.info-row {
  display:flex; gap:8px; flex-wrap:wrap;
  border-top:1px solid #12141e; padding-top:8px;
}
.info-chip { font-family:'VT323',monospace; font-size:13px; color:#3a4060; }
.info-chip span { color:#5a6888; }

/* ── EFEITOS ── */
.screen-flash {
  position:fixed; inset:0; z-index:100;
  background:rgba(255,40,40,0.28);
  pointer-events:none; opacity:0;
}
.screen-flash.active { animation:flashAnim 0.4s ease-out forwards; }
@keyframes flashAnim { 0%{opacity:1} 100%{opacity:0} }

.boss-sprite.hit { animation:bossHit 0.5s ease-out forwards; }
@keyframes bossHit {
  0%  {filter:drop-shadow(0 0 0 white) brightness(8);transform:scale(1.1);}
  40% {filter:drop-shadow(0 0 8px red) brightness(2);transform:scale(0.95);}
  100%{filter:drop-shadow(0 0 24px rgba(255,50,50,0.6)) brightness(1);transform:scale(1);}
}
.boss-sprite.dead { animation:bossDeath 1.1s ease-in forwards; }
@keyframes bossDeath {
  0%  {filter:brightness(8) saturate(0);transform:scale(1.1);opacity:1;}
  40% {filter:brightness(2) saturate(0);transform:scale(0.88) rotate(-4deg);opacity:0.7;}
  100%{filter:brightness(0) saturate(0);transform:scale(0.2) rotate(18deg) translateY(30px);opacity:0;}
}

.dmg-number {
  position:fixed;
  font-family:'Press Start 2P',monospace;
  font-size:14px; color:#fff;
  text-shadow:0 0 8px #ff2222,2px 2px 0 #660000;
  pointer-events:none; z-index:200;
  animation:dmgFloat 1.1s ease-out forwards;
  white-space:nowrap;
}
.dmg-number.crit {
  font-size:19px; color:#ffdd00;
  text-shadow:0 0 10px #ff8800,2px 2px 0 #663300;
}
@keyframes dmgFloat {
  0%  {transform:translateY(0) scale(0.6);opacity:1;}
  20% {transform:translateY(-14px) scale(1.2);opacity:1;}
  100%{transform:translateY(-60px) scale(0.9);opacity:0;}
}

.dmg-particle {
  position:fixed; width:4px; height:4px; border-radius:50%;
  pointer-events:none; z-index:190;
  animation:particleExplode var(--dur) ease-out forwards;
}
@keyframes particleExplode {
  0%  {transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;}
}

/* ── DEAD ── */
.dead-screen {
  position:absolute; inset:0; z-index:150;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(0,0,0,0); pointer-events:none; transition:background 1s;
}
.dead-screen.active { background:rgba(0,0,0,0.9); pointer-events:all; }
.dead-text {
  font-family:'Press Start 2P',monospace;
  font-size:14px; color:#ffdd00;
  text-shadow:0 0 16px #ff8800,3px 3px 0 #663300;
  letter-spacing:2px; opacity:0; transform:scale(0.5);
  text-align:center; line-height:2;
  transition:all 0.6s cubic-bezier(0.175,0.885,0.32,1.275) 0.5s;
}
.dead-screen.active .dead-text { opacity:1; transform:scale(1); }

/* ── LOADING ── */
.loading-overlay {
  position:absolute; inset:0; z-index:300;
  background:#07090f;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:10px;
  transition:opacity 0.5s;
}
.loading-overlay.hidden { opacity:0; pointer-events:none; }
.loading-text {
  font-family:'Press Start 2P',monospace;
  font-size:7px; color:#ff4444; letter-spacing:2px;
  animation:blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.loading-bar-track {
  width:120px; height:4px;
  background:#111320; border:1px solid #1e2235; border-radius:2px; overflow:hidden;
}
.loading-bar-fill {
  height:100%; background:linear-gradient(90deg,#cc1111,#ff4444);
  width:0%; animation:loadFill 1.4s ease-in-out forwards;
}
@keyframes loadFill { to{width:100%;} }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-text">LOADING BOSS...</div>
  <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
</div>

<div class="screen-flash" id="screenFlash"></div>

<div class="dead-screen" id="deadScreen">
  <div class="dead-text" id="deadText">BOSS DERROTADO!</div>
</div>

<div class="arena">
  <div class="wall wall-top"></div>
  <div class="wall wall-bottom"></div>
  <div class="wall wall-left"></div>
  <div class="wall wall-right"></div>

  <div class="battle-layout">
    <!-- Sprite -->
    <div class="boss-col">
      <div class="boss-aura" id="bossAura"></div>
      <img class="boss-sprite" id="bossSprite" src="" alt="Boss">
      <div class="boss-shadow" id="bossShadow"></div>
    </div>

    <!-- HUD -->
    <div class="hud-panel">
      <div class="hud-room" id="roomName">SALA 1 · CARREGANDO...</div>
      <div class="hud-name" id="bossName">???</div>
      <div class="hp-track">
        <div class="hp-pending" id="hpPending" style="width:0%"></div>
        <div class="hp-fill"    id="hpFill"    style="width:100%"></div>
      </div>
      <div class="hp-row">
        <span class="hp-current" id="hpCurrent">0</span>
        <span class="hp-max"     id="hpMax">/ 0 HP</span>
      </div>
      <div class="type-row" id="typeBadges"></div>
      <div class="info-row" id="infoRow"></div>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZDNq7MoIRgeBvzbaslBjpeMfY-Vm4gw5yTr8O1zgENE7zucykP7AFCJlE4Dg3RtVY/exec?action=obterStatusRPG";

const TYPE_COLORS = {
  fire:'#ff6b35',water:'#4fc3f7',grass:'#66bb6a',electric:'#ffee58',
  ice:'#80deea',fighting:'#ef5350',poison:'#ab47bc',ground:'#d4a574',
  flying:'#90caf9',psychic:'#f48fb1',bug:'#aed581',rock:'#bcaaa4',
  ghost:'#7e57c2',dragon:'#5c6bc0',dark:'#6a6a7a',steel:'#b0bec5',
  fairy:'#f8bbd9',normal:'#9e9e9e',
};

let state = { vidaAtual:0, vidaMaxima:0, lastVida:null, bossName:'', salaId:1, isDead:false, salaIdAtual:null };

const hpFill      = document.getElementById('hpFill');
const hpPending   = document.getElementById('hpPending');
const hpCurrent   = document.getElementById('hpCurrent');
const hpMax       = document.getElementById('hpMax');
const bossSprite  = document.getElementById('bossSprite');
const bossAura    = document.getElementById('bossAura');
const bossName    = document.getElementById('bossName');
const roomName    = document.getElementById('roomName');
const typeBadges  = document.getElementById('typeBadges');
const infoRow     = document.getElementById('infoRow');
const screenFlash = document.getElementById('screenFlash');
const deadScreen  = document.getElementById('deadScreen');
const deadText    = document.getElementById('deadText');
const loading     = document.getElementById('loading');

function triggerHit(dano, isCrit) {
  screenFlash.classList.remove('active'); void screenFlash.offsetWidth; screenFlash.classList.add('active');
  bossSprite.classList.remove('hit','dead'); void bossSprite.offsetWidth; bossSprite.classList.add('hit');
  setTimeout(()=>bossSprite.classList.remove('hit'),520);
  spawnDmgNumber(dano, isCrit);
  spawnParticles(isCrit?10:6);
  bossAura.style.animationDuration='0.4s';
  setTimeout(()=>bossAura.style.animationDuration='2.2s',600);
}

function triggerDeath() {
  bossSprite.classList.add('dead');
  document.getElementById('bossShadow').style.opacity='0';
  bossAura.style.opacity='0';
  let n=0; const iv=setInterval(()=>{
    screenFlash.classList.remove('active'); void screenFlash.offsetWidth; screenFlash.classList.add('active');
    if(++n>=3) clearInterval(iv);
  },160);
  setTimeout(async () => {
    deadScreen.classList.add('active');
    deadText.innerText = state.bossName + '\nDERROTADO!';

    try {
      await fetch(
        "https://script.google.com/macros/s/AKfycbxZDNq7MoIRgeBvzbaslBjpeMfY-Vm4gw5yTr8O1zgENE7zucykP7AFCJlE4Dg3RtVY/exec?action=avancarSala"
      );

      console.log("Nova sala criada");

    } catch (err) {
      console.error("Erro ao criar nova sala", err);
    }

  }, 750);
}

function spawnDmgNumber(dano, isCrit) {
  const rect=bossSprite.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/3;
  const el=document.createElement('div');
  el.className='dmg-number'+(isCrit?' crit':'');
  el.innerText=(isCrit?'★ ':'–')+dano+' HP';
  el.style.left=(cx-40+(Math.random()*24-12))+'px';
  el.style.top=(cy+(Math.random()*14-7))+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

function spawnParticles(qty) {
  const rect=bossSprite.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  for(let i=0;i<qty;i++){
    const p=document.createElement('div'); p.className='dmg-particle';
    const angle=Math.random()*Math.PI*2, dist=20+Math.random()*55, dur=0.3+Math.random()*0.4;
    p.style.setProperty('--tx',Math.cos(angle)*dist+'px');
    p.style.setProperty('--ty',Math.sin(angle)*dist+'px');
    p.style.setProperty('--dur',dur+'s');
    p.style.background=Math.random()>0.5?'#ff4444':'#ffaa00';
    p.style.left=(cx+Math.random()*14-7)+'px'; p.style.top=(cy+Math.random()*14-7)+'px';
    document.body.appendChild(p); setTimeout(()=>p.remove(),dur*1000+100);
  }
}

function updateHP(vidaAtual, vidaMaxima, animate=false) {
  const pct=Math.max(0,(vidaAtual/vidaMaxima)*100);
  const prev=state.lastVida!==null?Math.max(0,(state.lastVida/vidaMaxima)*100):pct;
  if(animate&&state.lastVida!==null&&state.lastVida>vidaAtual){
    const dano=state.lastVida-vidaAtual;
    hpPending.style.width=(prev-pct)+'%'; hpPending.style.right=pct+'%'; hpFill.style.width=pct+'%';
    setTimeout(()=>{hpPending.style.width='0%';},900);
    triggerHit(dano,dano>=50);
  } else { hpFill.style.width=pct+'%'; hpPending.style.width='0%'; }

  if(pct<=20){ hpFill.style.background='linear-gradient(90deg,#998800,#ffdd00)'; hpFill.style.boxShadow='0 0 7px rgba(255,220,0,0.7)'; bossAura.style.background='radial-gradient(circle,rgba(255,200,0,0.2) 0%,transparent 70%)'; }
  else if(pct<=50){ hpFill.style.background='linear-gradient(90deg,#a85000,#ff8c00)'; hpFill.style.boxShadow='0 0 7px rgba(255,140,0,0.6)'; bossAura.style.background='radial-gradient(circle,rgba(255,100,0,0.18) 0%,transparent 70%)'; }
  else { hpFill.style.background='linear-gradient(90deg,#cc1111,#ff4444)'; hpFill.style.boxShadow='0 0 7px rgba(255,50,50,0.6)'; bossAura.style.background='radial-gradient(circle,rgba(200,0,0,0.18) 0%,transparent 70%)'; }

  hpCurrent.innerText=vidaAtual; hpMax.innerText=`/ ${vidaMaxima} HP`; state.lastVida=vidaAtual;
}

function renderTypes(tipos) {
  typeBadges.innerHTML='';
  tipos.forEach(t=>{
    const b=document.createElement('span'); b.className='type-badge'; b.innerText=t.toUpperCase();
    const cor=TYPE_COLORS[t.toLowerCase()]||'#9e9e9e';
    b.style.background=cor+'22'; b.style.color=cor; b.style.border=`1px solid ${cor}44`;
    typeBadges.appendChild(b);
  });
}

function renderInfo(poke) {
  infoRow.innerHTML=`
    <div class="info-chip">ALT <span>${(poke.height/10).toFixed(1)}m</span></div>
    <div class="info-chip">· PESO <span>${(poke.weight/10).toFixed(1)}kg</span></div>
    <div class="info-chip">· SALA <span>#${state.salaId}</span></div>`;
}

function notifyParent() {
  if(window.parent&&window.parent!==window)
    window.parent.postMessage({id:'frame-rpg',height:420},'*');
}

async function loadBoss(isRefresh=false) {
  try {
    const res=await fetch(SCRIPT_URL+'&t='+Date.now());
    const rpg=await res.json();
    state.salaId=rpg.idSala; state.vidaAtual=rpg.vidaBoss; state.vidaMaxima=rpg.vidaMaxima||100; state.salaIdAtual=rpg.idSala;
    roomName.innerText=`SALA ${rpg.idSala} · ${(rpg.nomeSala||'').toUpperCase()}`;
    const pokeRes=await fetch(`https://pokeapi.co/api/v2/pokemon/${rpg.pokemonId}`);
    const poke=await pokeRes.json();
    state.bossName=poke.name.toUpperCase(); bossName.innerText=state.bossName;
    const sprite=poke.sprites?.versions?.['generation-v']?.['black-white']?.animated?.front_default||poke.sprites?.front_default;
    bossSprite.classList.remove('dead');
    bossSprite.classList.remove('hit');

    bossSprite.style.opacity = '1';
    bossSprite.style.transform = '';
    bossSprite.style.filter = '';

    document.getElementById('bossShadow').style.opacity = '1';
    bossAura.style.opacity = '1';

    bossSprite.src = sprite;

    setTimeout(() => {
      bossSprite.src = sprite;
    }, 50);
    renderTypes(poke.types.map(t=>t.type.name));
    renderInfo(poke);
    updateHP(state.vidaAtual,state.vidaMaxima,isRefresh);
    if(state.vidaAtual<=0&&!state.isDead){ state.isDead=true; triggerDeath(); }
    loading.classList.add('hidden');
    notifyParent();
  } catch(err){ console.error(err); bossName.innerText='OFFLINE'; loading.classList.add('hidden'); }
}

async function pollUpdates() {
  try {
    const res=await fetch(SCRIPT_URL+'&t='+Date.now());
    const rpg=await res.json();
    if(rpg.idSala!==state.salaIdAtual){ 
      state.isDead=false; 
      deadScreen.classList.remove('active'); 
      loading.classList.remove('hidden'); 
      await loadBoss(false); 
      return;
    }
    if(rpg.vidaBoss!==state.vidaAtual){ state.vidaAtual=rpg.vidaBoss; updateHP(rpg.vidaBoss,state.vidaMaxima,true); if(rpg.vidaBoss<=0&&!state.isDead){state.isDead=true;triggerDeath();} }
  } catch(e){}
}

loadBoss(false);
setInterval(pollUpdates,15000);
window.addEventListener('load',notifyParent);
window.addEventListener('resize',notifyParent);

window.addEventListener('message',e=>{
  if(e.data?.action==='triggerDmg'){
    const dano=e.data.dano||10;
    state.lastVida=state.vidaAtual;
    state.vidaAtual=Math.max(0,state.vidaAtual-dano);
    updateHP(state.vidaAtual,state.vidaMaxima,true);
    if(state.vidaAtual<=0&&!state.isDead){state.isDead=true;triggerDeath();}
  }
});
</script>
</body>
</html>
