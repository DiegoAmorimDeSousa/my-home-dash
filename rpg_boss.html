<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Procedural Dungeon Boss Room</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090b11;
    font-family: monospace;
}

/* ===================================================== */
/* DUNGEON (Agora Responsiva: Ocupa todo o espaço do iframe) */
/* ===================================================== */

.dungeon {
    position: relative;
    width: 100%;
    height: 100%; 
    overflow: hidden;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.9);
}

/* ===================================================== */
/* CAMADAS */
/* ===================================================== */

#floor,
#decor-layer,
#light-layer,
#particle-layer {
    position: absolute;
    inset: 0;
}

/* ===================================================== */
/* HUD */
/* ===================================================== */

.boss-hud {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    height: auto;
    background: rgba(0,0,0,0.85);
    padding: 12px;
    border: 2px solid rgba(0,0,0,0.8);
    z-index: 100;
    backdrop-filter: blur(4px);
    color: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    border-radius: 6px;
}

.boss-name {
    text-align: center;
    color: #ff5a5a;
    font-size: 16px;
    margin-bottom: 8px;
    font-weight: bold;
    letter-spacing: 1px;
}

.hp-container {
    height: 14px;
    background: #220000;
    border: 1px solid black;
    position: relative;
    margin-bottom: 8px;
}

.hp-bar {
    height: 100%;
    background:
        linear-gradient(
            180deg,
            #ff5959,
            #992222
        );
}

.hp-text {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 10px;
    font-weight: bold;
    text-shadow: 1px 1px 1px #000;
}

.boss-details {
    display: flex;
    justify-content: space-between;
    color: #a0aabf;
    font-size: 11px;
    border-top: 1px solid #333;
    padding-top: 6px;
    margin-top: 2px;
}

.boss-details span { 
    font-weight: bold; 
    color: #fff;
}

.type-badge { 
    color: #ffb703 !important; 
    text-transform: uppercase; 
}

/* ===================================================== */
/* HEROIS (Posicionados em % para acompanhar a tela) */
/* ===================================================== */

.hero {
    position: absolute;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.hero img {
    width: 64px;
    image-rendering: pixelated;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,0.6));
}

.hero-name {
    margin-top: 6px;
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 2px 8px;
    font-size: 10px;
}

/* ===================================================== */
/* BOSS */
/* ===================================================== */

.boss {
    position: absolute;
    z-index: 60;
    width: 150px;
    height: 150px;
    animation: bossFloat 2.5s ease-in-out infinite;
}

.boss img {
    width: 100%;
    image-rendering: pixelated;
    filter: drop-shadow(0 12px 10px rgba(0,0,0,0.7));
}

@keyframes bossFloat {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

/* ===================================================== */
/* SHADOWS */
/* ===================================================== */

.shadow {
    position: absolute;
    width: 90px;
    height: 20px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    filter: blur(6px);
    z-index: 10;
}

/* ===================================================== */
/* PARTICULAS */
/* ===================================================== */

.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    animation: particleFloat 6s infinite ease-in-out;
}

@keyframes particleFloat {
    0% { transform: translateY(0px); opacity: 0; }
    50% { transform: translateY(-20px); opacity: 1; }
    100% { transform: translateY(0px); opacity: 0; }
}

/* ===================================================== */
/* PAREDES (Preenchem dinamicamente as bordas do iframe) */
/* ===================================================== */

.wall {
    position: absolute;
    background:
        linear-gradient(
            180deg,
            rgba(70,70,90,0.95),
            rgba(30,30,40,0.95)
        );
    border: 3px solid rgba(0,0,0,0.8);
}

/* ===================================================== */
/* PILARES */
/* ===================================================== */

.pillar {
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 12px;
    background:
        linear-gradient(
            180deg,
            rgba(90,90,110,0.95),
            rgba(40,40,50,0.95)
        );
    border: 3px solid rgba(0,0,0,0.8);
    box-shadow: inset 0 0 8px rgba(255,255,255,0.05);
}

/* ===================================================== */
/* LUZ */
/* ===================================================== */

.light {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    filter: blur(25px);
    opacity: 0.7;
}

/* ===================================================== */
/* TEMAS */
/* ===================================================== */

.theme-ice {
    background:
        radial-gradient(circle at center, rgba(255,255,255,0.04), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 48px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 48px),
        linear-gradient(180deg, #26354f, #131c2e);
}

.theme-fire {
    background:
        radial-gradient(circle at center, rgba(255,140,0,0.05), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 42px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 42px),
        linear-gradient(180deg, #47261f, #24110d);
}

.theme-poison {
    background:
        radial-gradient(circle at center, rgba(0,255,100,0.04), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 50px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 50px),
        linear-gradient(180deg, #1c3826, #102016);
}

.theme-necro {
    background:
        radial-gradient(circle at center, rgba(180,0,255,0.05), transparent 60%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 46px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 46px),
        linear-gradient(180deg, #2f1f40, #16101f);
}

</style>
</head>

<body>

<div class="dungeon" id="dungeon">
    <div id="floor"></div>
    <div id="decor-layer"></div>
    <div id="light-layer"></div>
    <div id="particle-layer"></div>

    <div class="boss-hud">
        <div class="boss-name" id="boss-name">IDENTIFICANDO...</div>
        <div class="hp-container">
            <div class="hp-bar"></div>
            <div class="hp-text" id="hp-text">0 / 0 HP</div>
        </div>
        <div class="boss-details">
            <div>TIPO: <span id="type-display" class="type-badge">---</span></div>
            <div>ALT: <span id="height-display">---</span></div>
            <div>PESO: <span id="weight-display">---</span></div>
        </div>
    </div>

    <div class="hero" id="diego" style="left: 15%; top: 40%;">
        <img src="diego.png">
        <div class="hero-name">DIEGO</div>
    </div>

    <div class="hero" id="beatriz" style="left: 8%; top: 55%;">
        <img src="beatriz.png">
        <div class="hero-name">BEATRIZ</div>
    </div>

    <div class="shadow" style="left: 15%; top: 49%;"></div>
    <div class="shadow" style="left: 8%; top: 64%;"></div>

    <div class="boss" id="boss" style="right: 15%; top: 38%;">
        <img id="boss-image">
    </div>

    <div class="shadow" style="right: 17%; top: 57%;"></div>
</div>

<script>

/* ===================================================== */
/* ELEMENTOS */
/* ===================================================== */

const dungeon = document.getElementById('dungeon');
const decorLayer = document.getElementById('decor-layer');
const lightLayer = document.getElementById('light-layer');
const particleLayer = document.getElementById('particle-layer');

/* ===================================================== */
/* TEMAS */
/* ===================================================== */

const themes = [
    { className: 'theme-ice', glow: 'rgba(120,180,255,0.25)' },
    { className: 'theme-fire', glow: 'rgba(255,120,40,0.25)' },
    { className: 'theme-poison', glow: 'rgba(0,255,120,0.22)' },
    { className: 'theme-necro', glow: 'rgba(180,0,255,0.25)' }
];

function random(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateTheme() {
    const theme = themes[random(0, themes.length - 1)];
    dungeon.classList.add(theme.className);
    return theme;
}

/* ===================================================== */
/* PAREDES DINÂMICAS (Coladas nas bordas da janela) */
/* ===================================================== */

function createWalls() {
    decorLayer.innerHTML = ''; // Limpa antes de gerar para evitar duplicados
    
    const walls = [
        { left: '40px', top: '40px', right: '40px', height: '25px' }, // Topo
        { left: '40px', bottom: '40px', right: '40px', height: '25px' }, // Baixo
        { left: '40px', top: '40px', width: '25px', bottom: '40px' }, // Esquerda
        { right: '40px', top: '40px', width: '25px', bottom: '40px' } // Direita
    ];

    walls.forEach(w => {
        const wall = document.createElement('div');
        wall.classList.add('wall');
        Object.assign(wall.style, {
            left: w.left || '',
            right: w.right || '',
            top: w.top || '',
            bottom: w.bottom || '',
            width: w.width || 'auto',
            height: w.height || 'auto'
        });
        decorLayer.appendChild(wall);
    });
}

/* ===================================================== */
/* PILARES */
/* ===================================================== */

function createPillars() {
    const amount = random(3, 5);
    const w = dungeon.clientWidth;
    const h = dungeon.clientHeight;

    for(let i = 0; i < amount; i++) {
        const pillar = document.createElement('div');
        pillar.classList.add('pillar');
        // Mantém os pilares na zona central útil do cenário dinâmico
        pillar.style.left = random(Math.floor(w * 0.3), Math.floor(w * 0.65)) + 'px';
        pillar.style.top = random(Math.floor(h * 0.25), Math.floor(h * 0.65)) + 'px';
        decorLayer.appendChild(pillar);
    }
}

/* ===================================================== */
/* LUZES E PARTICULAS RESPONSIVAS */
/* ===================================================== */

function createLights(color) {
    const amount = random(2, 4);
    for(let i = 0; i < amount; i++) {
        const light = document.createElement('div');
        light.classList.add('light');
        light.style.left = random(10, 75) + '%';
        light.style.top = random(15, 65) + '%';
        light.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
        lightLayer.appendChild(light);
    }
}

function createParticles() {
    const amount = 35;
    for(let i = 0; i < amount; i++) {
        const p = document.createElement('div');
        p.classList.add('particle');
        p.style.left = random(5, 95) + '%';
        p.style.top = random(5, 95) + '%';
        p.style.animationDelay = Math.random() * 6 + 's';
        particleLayer.appendChild(p);
    }
}

/* ===================================================== */
/* API POKÉMON */
/* ===================================================== */

async function loadBoss() {
    try {
        // 1. Busca os dados do Boss travados na sua planilha (agora com 7 colunas)
        const urlScript = "https://script.google.com/macros/s/AKfycbxZDNq7MoIRgeBvzbaslBjpeMfY-Vm4gw5yTr8O1zgENE7zucykP7AFCJlE4Dg3RtVY/exec?action=obterStatusRPG";
        const resPlanilha = await fetch(urlScript);
        const dadosRPG = await resPlanilha.json();

        // Pega o ID do Pokémon que a planilha escolheu
        const pokemonId = dadosRPG.pokemonId; 

        // 2. Busca a imagem e dados reais desse monstro na PokeAPI
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
        const data = await response.json();

        const nomeReal = data.name.toUpperCase();
        const tipos = data.types.map(t => t.type.name).join('/');
        const altura = (data.height / 10).toFixed(1) + "m";
        const peso = (data.weight / 10).toFixed(1) + "kg";

        // Atualiza os elementos da tela do jogo
        document.getElementById('boss-image').src = data.sprites.front_default;
        document.getElementById('boss-name').innerText = nomeReal;
        document.getElementById('type-display').innerText = tipos;
        document.getElementById('height-display').innerText = altura;
        document.getElementById('weight-display').innerText = peso;

        // --- CÁLCULO VISUAL DA BARRA AJUSTADO PARA A TAREFA 1 ---
        const vidaAtual = dadosRPG.vidaBoss;
        const vidaMaxima = dadosRPG.vidaMaxima || 100; // Evita divisão por zero caso a planilha falhe

        // Atualiza o texto do HUD com os valores reais da planilha
        document.getElementById('hp-text').innerText = `${vidaAtual} / ${vidaMaxima} HP`;
        
        // Calcula a porcentagem exata que sobrou de vida para encolher a barra vermelha
        const porcentagemBarra = (vidaAtual / vidaMaxima) * 100;
        document.querySelector('.hp-bar').style.width = `${porcentagemBarra}%`;
        
        notificarJanelaPai();
    }
    catch(err) {
        console.error(err);
        document.getElementById('boss-name').innerText = "BOSS INDISPONÍVEL";
    }
}

/* ===================================================== */
/* REDIMENSIONAMENTO MANUAL */
/* ===================================================== */

function notificarJanelaPai() {
    if (window.parent && window.parent !== window) {
        // Envia o min-height exato estipulado pelo seu painel para casar perfeito
        window.parent.postMessage({
            id: "frame-rpg",
            height: 520 
        }, "*");
    }
}

/* ===================================================== */
/* INIT */
/* ===================================================== */

const currentTheme = generateTheme();
createWalls();
createPillars();
createLights(currentTheme.glow);
createParticles();
loadBoss();

window.addEventListener('load', notificarJanelaPai);
window.addEventListener('resize', () => {
    createWalls();
    notificarJanelaPai();
});

</script>

</body>
</html>
