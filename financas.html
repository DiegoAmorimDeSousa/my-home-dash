<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
      :root {
        --bg: #0b0e14;
        --card: #161b22;
        --purple: #a855f7;
        --text: #ffffff;
        --border: #30363d;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .finance-module {
        padding: 10px;
      }

      .title-section h2 {
        font-family: "Montserrat", sans-serif;
        font-size: 1.1rem;
        text-transform: uppercase;
        margin: 0 0 20px 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .fin-grid {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 20px;
        align-items: start;
      }

      .fin-card {
        background: var(--card);
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 20px;
        margin-bottom: 15px;
      }

      /* CARD DE DESTAQUE */
      .highlight-card {
        background: linear-gradient(
          135deg,
          rgba(168, 85, 247, 0.2) 0%,
          rgba(22, 27, 34, 1) 100%
        );
        border: 1px solid var(--purple);
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .total-header {
        text-align: center;
        margin-bottom: 10px;
      }
      .total-label {
        font-size: 0.65rem;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
      }
      .total-value {
        font-size: 2.2rem;
        font-weight: 800;
        font-family: "Montserrat";
        margin-top: 5px;
      }

      .chart-container {
        height: 280px;
        position: relative;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 12px 8px;
        border-bottom: 1px solid var(--border);
        font-size: 0.85rem;
      }
      .val-cell {
        text-align: right;
        font-weight: 700;
        color: #ef4444;
      }

      /* TAGS DINÂMICAS */
      .tag {
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.05);
      }

      @media (max-width: 900px) {
        .fin-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── MODO COMPACTO (resumo) ── */
      html, body.is-compact { height: 100%; }
      body.is-compact .finance-module {
        padding: 6px 14px;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      body.is-compact .title-section h2 { font-size: 0.85rem; margin-bottom: 10px; flex-shrink: 0; }
      body.is-compact .fin-grid {
        grid-template-columns: 1fr;
        gap: 0;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      body.is-compact .col-left {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      body.is-compact .fin-grid > .fin-card { display: none; } /* tabela de transações some */
      body.is-compact .chart-container { display: none; } /* gráfico some, lista de categorias entra no lugar */
      body.is-compact .col-left .fin-card {
        padding: 10px 14px 4px;
        margin-bottom: 0;
        flex-shrink: 0;
      }
      body.is-compact .highlight-card { margin-bottom: 8px; padding: 10px; flex-shrink: 0; }
      body.is-compact .total-value { font-size: 1.5rem; }
      body.is-compact .total-header { margin-bottom: 0; }

      /* Card da lista de categorias: esconde no modo cheio, mostra e estica no compacto */
      .cat-list-card { display: none; }
      body.is-compact .cat-list-card {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 10px 14px;
      }
      .cat-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 4px;
      }
      .cat-row { font-size: 0.8rem; }
      .cat-row-top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .cat-row-name { display: flex; align-items: center; gap: 6px; font-weight: 600; }
      .cat-row-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
      .cat-row-value { font-weight: 700; color: #8b949e; font-size: 0.78rem; }
      .cat-row-bar-bg {
        height: 5px;
        border-radius: 3px;
        background: rgba(255,255,255,0.06);
        overflow: hidden;
      }
      .cat-row-bar {
        height: 100%;
        border-radius: 3px;
      }

      /* ── SCROLLBAR ESTILIZADA ── */
      .cat-list::-webkit-scrollbar { width: 6px; }
      .cat-list::-webkit-scrollbar-track { background: transparent; }
      .cat-list::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 4px; opacity: 0.5; }
      .cat-list { scrollbar-width: thin; scrollbar-color: var(--purple) transparent; }
    </style>
  </head>
  <body>
    <div class="finance-module" id="content-wrapper">
      <div class="title-section">
        <h2><span style="color: var(--purple)">●</span> GESTÃO FINANCEIRA</h2>
      </div>

      <div class="fin-grid">
        <div class="col-left">
          <div class="highlight-card" id="top-expense-card">
            <div class="total-label">MAIOR GASTO</div>
            <div
              id="top-cat-name"
              style="
                font-family: &quot;Montserrat&quot;;
                color: var(--purple);
                font-size: 1.1rem;
                margin-top: 5px;
              "
            >
              ---
            </div>
            <div id="top-cat-value" style="font-weight: 800; font-size: 1.3rem">
              R$ 0,00
            </div>
          </div>

          <div class="fin-card">
            <div class="total-header">
              <div class="total-label">Gastos Totais</div>
              <div id="gasto-total" class="total-value">R$ 0,00</div>
            </div>
            <div class="chart-container">
              <canvas id="financeChart"></canvas>
            </div>
          </div>

          <!-- Só aparece no modo compacto: lista de categorias -->
          <div class="fin-card cat-list-card" id="cat-list-card">
            <div class="total-label" style="margin-bottom: 10px;">Gastos por Categoria</div>
            <div class="cat-list" id="lista-categorias"></div>
          </div>
        </div>

        <div class="fin-card">
          <div
            class="total-label"
            style="
              margin-bottom: 15px;
              display: flex;
              justify-content: space-between;
            "
          >
            <span>Últimas 10 Movimentações</span>
            <span style="color: var(--purple); font-size: 0.6rem"
              >ATUALIZADO AGORA</span
            >
          </div>
          <table>
            <tbody id="lista-transacoes"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script type="module">
      const params = new URLSearchParams(location.search);
      const isCompact = params.get("compact") === "1";
      const frameId = params.get("frameId") || "frame-financas";
      if (isCompact) document.body.classList.add("is-compact");

      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
      import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCbsu_WD-7L-elljYBJ0j1naGiSGCnhDbE",
        authDomain: "my-home-dash-b554d.firebaseapp.com",
        projectId: "my-home-dash-b554d",
        storageBucket: "my-home-dash-b554d.firebasestorage.app",
        messagingSenderId: "225507144407",
        appId: "1:225507144407:web:833b14e322dca4c8b23692",
      };

      const fbApp = initializeApp(firebaseConfig);
      const auth = getAuth(fbApp);
      const db = getFirestore(fbApp);

      // MAPEAMENTO DE CORES POR CATEGORIA
      const colorMap = {
        Mercado: "#3b82f6",   // Azul
        Lanche: "#f59e0b",    // Laranja
        Saúde: "#ef4444",     // Vermelho
        Almoço: "#22c55e",    // Verde
        Contas: "#a855f7",    // Roxo
        Lazer: "#ec4899",     // Rosa
        Casinha: "#00d4ff",   // Ciano
        Vestuária: "#eab308", // Amarelo
        Café: "#a16207",      // Marrom
        Outros: "#8b949e",    // Cinza
      };

      function formatHora(timestamp) {
        if (!timestamp || !timestamp.toDate) return "--:--";
        return timestamp.toDate().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      }

      function metodoTagHtml(metodo) {
        if (!metodo || metodo === "indefinido") return "";
        const cor = metodo === "credito" ? "#f59e0b" : "#3b82f6";
        const label = metodo === "credito" ? "Crédito" : "Débito";
        return `<span class="tag" style="color:${cor};background:${cor}22;margin-left:4px;">${label}</span>`;
      }

      function parcelaTagHtml(parcela) {
        if (!parcela || !parcela.total) return "";
        return `<span class="tag" style="color:#ec4899;background:#ec489922;margin-left:4px;">${parcela.atual}/${parcela.total}</span>`;
      }

      function renderTudo(transacoes) {
        let totalGeral = 0;
        let catTotals = {};
        let html = "";

        transacoes.forEach((t, index) => {
          const valorNum = Number(t.valor) || 0;
          const cat = t.categoria || "Outros";
          const color = colorMap[cat] || colorMap["Outros"];

          totalGeral += valorNum;
          catTotals[cat] = (catTotals[cat] || 0) + valorNum;

          if (index < 10) {
            html += `
              <tr>
                <td style="color: #8b949e; width: 45px;">${formatHora(t.data)}</td>
                <td style="font-weight: 600;">
                  ${t.dono ? `<span style="color:#8b949e;font-size:0.68rem;">${t.dono}</span><br>` : ""}${t.descricao || ""}
                </td>
                <td>
                  <span class="tag" style="color: ${color}; background: ${color}22;">${cat}</span>${metodoTagHtml(t.metodo)}${parcelaTagHtml(t.parcela)}
                </td>
                <td class="val-cell">R$ ${valorNum.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}</td>
              </tr>`;
          }
        });

        if (!Object.keys(catTotals).length) {
          document.getElementById("top-cat-name").innerText = "SEM DADOS";
          document.getElementById("top-cat-value").innerText = "R$ 0,00";
        } else {
          const topCat = Object.keys(catTotals).reduce((a, b) => (catTotals[a] > catTotals[b] ? a : b));
          document.getElementById("top-cat-name").innerText = topCat.toUpperCase();
          document.getElementById("top-cat-value").innerText =
            `R$ ${catTotals[topCat].toLocaleString("pt-BR", { minimumFractionDigits: 2 })}`;
        }

        document.getElementById("lista-transacoes").innerHTML =
          html || `<tr><td colspan="4" style="text-align:center;color:#8b949e;padding:20px;">Nenhuma transação ainda</td></tr>`;
        document.getElementById("gasto-total").innerText =
          `R$ ${totalGeral.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}`;

        const catOrdenadas = Object.entries(catTotals).sort((a, b) => b[1] - a[1]);
        const maiorCatValor = catOrdenadas.length ? catOrdenadas[0][1] : 1;
        document.getElementById("lista-categorias").innerHTML = catOrdenadas
          .map(([cat, valor]) => {
            const color = colorMap[cat] || colorMap["Outros"];
            const pct = Math.max(4, (valor / maiorCatValor) * 100);
            return `
              <div class="cat-row">
                <div class="cat-row-top">
                  <span class="cat-row-name">
                    <span class="cat-row-dot" style="background:${color}"></span>${cat}
                  </span>
                  <span class="cat-row-value">R$ ${valor.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}</span>
                </div>
                <div class="cat-row-bar-bg">
                  <div class="cat-row-bar" style="width:${pct}%; background:${color};"></div>
                </div>
              </div>`;
          })
          .join("");

        renderChart(catTotals, totalGeral);

        setTimeout(() => {
          const height = document.getElementById("content-wrapper").offsetHeight;
          window.parent.postMessage({ height: height, id: frameId }, "*");
        }, 150);
      }

      function renderChart(dataObj, totalGeral) {
        const ctx = document.getElementById("financeChart").getContext("2d");
        if (window.chartInst) window.chartInst.destroy();

        const labels = Object.keys(dataObj);
        const colors = labels.map((l) => colorMap[l] || colorMap["Outros"]);

        window.chartInst = new Chart(ctx, {
          type: "doughnut",
          plugins: [ChartDataLabels],
          data: {
            labels: labels,
            datasets: [
              {
                data: Object.values(dataObj),
                backgroundColor: colors,
                borderWidth: 2,
                borderColor: "#161b22",
                hoverOffset: 15,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: "bottom",
                labels: { color: "#8b949e", font: { size: 10 }, usePointStyle: true, padding: 12 },
              },
              datalabels: {
                color: "#fff",
                font: { family: "Montserrat", weight: "bold", size: 10 },
                formatter: (value) => {
                  let p = ((value / totalGeral) * 100).toFixed(0);
                  return p > 4 ? p + "%" : "";
                },
              },
              tooltip: {
                callbacks: {
                  label: (context) => ` ${context.label}: R$ ${context.parsed.toLocaleString("pt-BR")}`,
                },
              },
            },
          },
        });
      }

      async function iniciar() {
        try {
          await signInAnonymously(auth);
        } catch (e) {
          console.error("Erro no login anônimo:", e);
          document.getElementById("top-cat-name").innerText = "ERRO DE LOGIN";
          return;
        }

        const q = query(collection(db, "transacoes"), orderBy("data", "desc"));
        onSnapshot(
          q,
          (snapshot) => {
            const transacoes = snapshot.docs.map((d) => d.data());
            renderTudo(transacoes);
          },
          (err) => {
            console.error("Erro lendo Firestore:", err);
            document.getElementById("top-cat-name").innerText = "ERRO AO LER";
          }
        );
      }

      iniciar();
    </script>
  </body>
</html>
