<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
      :root {
        --bg: #0b0e14;
        --card: #161b22;
        --purple: #a855f7;
        --text: #ffffff;
        --border: #30363d;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .finance-module {
        padding: 10px;
      }

      .title-section h2 {
        font-family: "Montserrat", sans-serif;
        font-size: 1.1rem;
        text-transform: uppercase;
        margin: 0 0 20px 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .fin-grid {
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 20px;
        align-items: start;
      }

      .fin-card {
        background: var(--card);
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 20px;
        margin-bottom: 15px;
      }

      /* CARD DE DESTAQUE */
      .highlight-card {
        background: linear-gradient(
          135deg,
          rgba(168, 85, 247, 0.2) 0%,
          rgba(22, 27, 34, 1) 100%
        );
        border: 1px solid var(--purple);
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .total-header {
        text-align: center;
        margin-bottom: 10px;
      }
      .total-label {
        font-size: 0.65rem;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
      }
      .total-value {
        font-size: 2.2rem;
        font-weight: 800;
        font-family: "Montserrat";
        margin-top: 5px;
      }

      .chart-container {
        height: 280px;
        position: relative;
      }
      .chart-container.metodo {
        height: 170px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 12px 8px;
        border-bottom: 1px solid var(--border);
        font-size: 0.85rem;
        vertical-align: middle;
      }
      .val-cell {
        text-align: right;
        font-weight: 700;
        color: #ef4444;
        white-space: nowrap;
      }

      /* TAGS DINÂMICAS */
      .tag {
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        background: rgba(255, 255, 255, 0.05);
        display: inline-block;
        margin-top: 2px;
      }

      /* AÇÕES DE LINHA (editar/excluir) */
      .row-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
      .row-actions button {
        background: transparent;
        border: 1px solid var(--border);
        color: #8b949e;
        border-radius: 4px;
        width: 22px; height: 22px;
        font-size: 0.7rem;
        cursor: pointer;
        transition: all 0.15s;
        line-height: 1;
      }
      .row-actions button:hover { border-color: var(--purple); color: var(--purple); }
      .row-actions .btn-del:hover { border-color: #ef4444; color: #ef4444; }

      /* LINHA EM MODO EDIÇÃO */
      .edit-input, .edit-select {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 0.78rem;
        padding: 5px 6px;
        margin-bottom: 4px;
      }
      .edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
      .edit-actions button {
        font-family: "Inter", sans-serif;
        font-size: 0.68rem;
        font-weight: 700;
        border: none;
        border-radius: 4px;
        padding: 5px 9px;
        cursor: pointer;
      }
      .btn-salvar { background: var(--purple); color: #fff; }
      .btn-cancelar { background: rgba(255,255,255,0.08); color: var(--text); }

      /* LISTA DOS ÚLTIMOS 3 MESES */
      .mes-list { display: flex; flex-direction: column; gap: 10px; }
      .mes-row {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .mes-row-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .mes-nome {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 0.82rem;
        text-transform: capitalize;
      }
      .mes-total { font-weight: 800; font-size: 0.88rem; }
      .mes-top-cat {
        font-size: 0.72rem;
        color: #8b949e;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .mes-top-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

      .mes-filter-select {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 0.68rem;
        padding: 3px 5px;
        max-width: 130px;
        text-transform: none;
        letter-spacing: normal;
        font-weight: 500;
      }

      @media (max-width: 900px) {
        .fin-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── MODO COMPACTO (resumo) ── */
      html, body.is-compact { height: 100%; }
      body.is-compact .finance-module {
        padding: 6px 14px;
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      body.is-compact .title-section h2 { font-size: 0.85rem; margin-bottom: 10px; flex-shrink: 0; }
      body.is-compact .fin-grid {
        grid-template-columns: 1fr;
        gap: 0;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      body.is-compact .col-left {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        width: 95vw;
      }
      body.is-compact .fin-grid > .fin-card { display: none; } /* tabela de transações some */
      body.is-compact .full-only { display: none; } /* segundo gráfico (método) só no expandido */

      body.is-compact .col-left .fin-card {
        padding: 10px 14px;
        margin-bottom: 8px;
        flex-shrink: 0;
      }
      body.is-compact .highlight-card { margin-bottom: 8px; padding: 10px; flex-shrink: 0; }
      body.is-compact .total-value { font-size: 1.5rem; }
      body.is-compact .total-header { display: none; } /* some o número grande, só sobra o gráfico */
      body.is-compact .chart-container { height: 130px; }

      /* Card dos últimos 3 meses: no compacto estica e rola */
      body.is-compact #mes-card {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        margin-bottom: 0;
      }
      body.is-compact .mes-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-right: 4px;
      }

      /* ── SCROLLBAR ESTILIZADA ── */
      .mes-list::-webkit-scrollbar { width: 6px; }
      .mes-list::-webkit-scrollbar-track { background: transparent; }
      .mes-list::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 4px; opacity: 0.5; }
      .mes-list { scrollbar-width: thin; scrollbar-color: var(--purple) transparent; }
    </style>
  </head>
  <body>
    <div class="finance-module" id="content-wrapper">
      <div class="title-section">
        <h2><span style="color: var(--purple)">●</span> GESTÃO FINANCEIRA</h2>
      </div>

      <div class="fin-grid">
        <div class="col-left">
          <div class="highlight-card" id="top-expense-card">
            <div class="total-label">MAIOR GASTO <span id="periodo-label-1" style="opacity:0.7;"></span></div>
            <div
              id="top-cat-name"
              style="
                font-family: &quot;Montserrat&quot;;
                color: var(--purple);
                font-size: 1.1rem;
                margin-top: 5px;
              "
            >
              ---
            </div>
            <div id="top-cat-value" style="font-weight: 800; font-size: 1.3rem">
              R$ 0,00
            </div>
          </div>

          <div class="fin-card">
            <div class="total-header">
              <div class="total-label" style="display:flex; justify-content:space-between; align-items:center;">
                <span>Gastos Totais <span id="periodo-label-2" style="opacity:0.7;"></span></span>
                <select id="periodo-filter" class="mes-filter-select" onchange="onPeriodoChange()">
                  <option value="mes">Este Mês</option>
                  <option value="ano">Este Ano</option>
                  <option value="tudo">Tudo</option>
                </select>
              </div>
              <div id="gasto-total" class="total-value">R$ 0,00</div>
            </div>
            <div class="chart-container">
              <canvas id="financeChart"></canvas>
            </div>
          </div>

          <!-- Só no expandido: segundo gráfico, por método de pagamento -->
          <div class="fin-card full-only">
            <div class="total-label" style="margin-bottom: 10px;">Por Método de Pagamento</div>
            <div class="chart-container metodo">
              <canvas id="metodoChart"></canvas>
            </div>
          </div>

          <!-- Últimos 3 meses — aparece no compacto E no expandido -->
          <div class="fin-card" id="mes-card">
            <div class="total-label" style="margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <span>Últimos 3 Meses</span>
              <select id="mes-cat-filter" class="mes-filter-select" onchange="onMesFiltroChange()">
                <option value="">Categoria mais alta</option>
              </select>
            </div>
            <div class="mes-list" id="lista-meses"></div>
          </div>
        </div>

        <div class="fin-card">
          <div
            class="total-label"
            style="
              margin-bottom: 15px;
              display: flex;
              justify-content: space-between;
            "
          >
            <span>Últimas 10 Movimentações</span>
            <span style="color: var(--purple); font-size: 0.6rem"
              >ATUALIZADO AGORA</span
            >
          </div>
          <table>
            <tbody id="lista-transacoes"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script type="module">
      const params = new URLSearchParams(location.search);
      const isCompact = params.get("compact") === "1";
      const frameId = params.get("frameId") || "frame-financas";
      if (isCompact) document.body.classList.add("is-compact");

      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
      import {
        getFirestore, collection, query, orderBy, onSnapshot,
        doc, updateDoc, deleteDoc,
      } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCbsu_WD-7L-elljYBJ0j1naGiSGCnhDbE",
        authDomain: "my-home-dash-b554d.firebaseapp.com",
        projectId: "my-home-dash-b554d",
        storageBucket: "my-home-dash-b554d.firebasestorage.app",
        messagingSenderId: "225507144407",
        appId: "1:225507144407:web:833b14e322dca4c8b23692",
      };

      const fbApp = initializeApp(firebaseConfig);
      const auth = getAuth(fbApp);
      const db = getFirestore(fbApp);

      const CATEGORIAS = ["Contas", "Lanche", "Lazer", "Almoço", "Café", "Mercado", "Saúde", "Vestuária", "Casinha", "Outros"];
      const colorMap = {
        Mercado: "#3b82f6", Lanche: "#f59e0b", Saúde: "#ef4444", Almoço: "#22c55e",
        Contas: "#a855f7", Lazer: "#ec4899", Casinha: "#00d4ff",
        Vestuária: "#eab308", Café: "#a16207", Outros: "#8b949e",
      };
      const METODO_LABEL_FIXO = { debito: "Débito", credito: "Crédito", cartao_mae: "Cartão Mãe" };
      function metodoLabel(metodo) {
        return METODO_LABEL_FIXO[metodo] || metodo;
      }

      // Métodos que representam pagamento "diferido" (só saem de verdade
      // quando a fatura é paga) — não entram nas somas/maior gasto/3 meses.
      const METODOS_DIFERIDOS = ["credito", "cartao_mae"];

      // Gera uma cor estável (sempre a mesma pra mesma string) pra categorias
      // que não estão no colorMap fixo — assim categorias novas/personalizadas
      // não ficam todas cinza "Outros", cada uma pega uma cor própria.
      function corPara(categoria) {
        if (colorMap[categoria]) return colorMap[categoria];
        let hash = 0;
        for (let i = 0; i < categoria.length; i++) hash = categoria.charCodeAt(i) + ((hash << 5) - hash);
        const hue = Math.abs(hash) % 360;
        return `hsl(${hue}, 65%, 58%)`;
      }

      let ultimasTransacoes = []; // cache local pra reabrir edição sem esperar novo snapshot
      let ultimasSemCredito = []; // idem, mas já sem os lançamentos diferidos (crédito/cartão mãe)
      let editingId = null;
      let periodoFiltro = "mes"; // 'mes' | 'ano' | 'tudo' — controla Maior Gasto / Gastos Totais / gráfico de categoria

      const PERIODO_LABEL = { mes: "(este mês)", ano: "(este ano)", tudo: "(tudo)" };

      function filtrarPorPeriodo(transacoes, periodo) {
        if (periodo === "tudo") return transacoes;
        const hoje = new Date();
        return transacoes.filter((t) => {
          if (!t.data || !t.data.toDate) return false;
          const d = t.data.toDate();
          if (periodo === "ano") return d.getFullYear() === hoje.getFullYear();
          return d.getFullYear() === hoje.getFullYear() && d.getMonth() === hoje.getMonth();
        });
      }

      window.onPeriodoChange = function () {
        periodoFiltro = document.getElementById("periodo-filter").value;
        renderTudo(ultimasTransacoes);
      };

      function formatHora(timestamp) {
        if (!timestamp || !timestamp.toDate) return "--:--";
        return timestamp.toDate().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      }

      function metodoTagHtml(metodo) {
        if (!metodo || metodo === "indefinido") return "";
        const cor = corPara(metodo);
        return `<span class="tag" style="color:${cor};background:${cor}22;">${metodoLabel(metodo)}</span>`;
      }

      function parcelaTagHtml(parcela) {
        if (!parcela || !parcela.total) return "";
        return `<span class="tag" style="color:#ec4899;background:#ec489922;">${parcela.atual}/${parcela.total}</span>`;
      }

      // ── LINHA NORMAL ──
      function rowHtml(t) {
        const valorNum = Number(t.valor) || 0;
        const cat = t.categoria || "Outros";
        const color = corPara(cat);
        return `
          <tr>
            <td style="color: #8b949e; width: 42px;">${formatHora(t.data)}</td>
            <td style="font-weight: 600;">
              ${t.dono ? `<span style="color:#8b949e;font-size:0.68rem;">${t.dono}</span><br>` : ""}${t.descricao || ""}
            </td>
            <td>
              <span class="tag" style="color: ${color}; background: ${color}22;">${cat}</span>
              ${metodoTagHtml(t.metodo)}${parcelaTagHtml(t.parcela)}
            </td>
            <td class="val-cell">
              R$ ${valorNum.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}
              <div class="row-actions full-only">
                <button title="Editar" onclick="iniciarEdicao('${t.id}')">✏️</button>
                <button class="btn-del" title="Excluir" onclick="excluirTransacao('${t.id}')">🗑️</button>
              </div>
            </td>
          </tr>`;
      }

      // Categorias conhecidas = as fixas + qualquer categoria que já apareceu
      // nos dados (inclusive as personalizadas que você já cadastrou antes).
      function categoriasConhecidas() {
        const vistas = new Set(CATEGORIAS);
        ultimasTransacoes.forEach((t) => { if (t.categoria) vistas.add(t.categoria); });
        return [...vistas];
      }

      // Mesma ideia pra método: 3 opções rápidas + qualquer valor que já
      // apareceu nos dados (ex: "V.A" cadastrado direto no banco).
      function metodosConhecidos() {
        const vistos = new Set(["debito", "credito", "cartao_mae"]);
        ultimasTransacoes.forEach((t) => { if (t.metodo && t.metodo !== "indefinido") vistos.add(t.metodo); });
        return [...vistos];
      }

      // ── LINHA EM MODO EDIÇÃO ──
      function editRowHtml(t) {
        const opcoes = categoriasConhecidas();
        const catAtualConhecida = opcoes.includes(t.categoria);
        const catOptions =
          opcoes.map(c => `<option value="${c}" ${c === t.categoria ? "selected" : ""}>${c}</option>`).join("") +
          `<option value="__custom__" ${!catAtualConhecida ? "selected" : ""}>+ Nova categoria…</option>`;

        const metodoAtual = t.metodo || "indefinido";
        const metodoOpcoes = metodosConhecidos();
        const metodoAtualConhecido = metodoAtual === "indefinido" || metodoOpcoes.includes(metodoAtual);
        const metodoOptions =
          `<option value="indefinido" ${metodoAtual === "indefinido" ? "selected" : ""}>Indefinido</option>` +
          metodoOpcoes.map(m => `<option value="${m}" ${m === metodoAtual ? "selected" : ""}>${metodoLabel(m)}</option>`).join("") +
          `<option value="__custom__" ${!metodoAtualConhecido ? "selected" : ""}>+ Novo método…</option>`;

        return `
          <tr>
            <td colspan="4" style="background:rgba(168,85,247,0.05);">
              <input class="edit-input" id="edit-desc-${t.id}" type="text" value="${(t.descricao || "").replace(/"/g, "&quot;")}" placeholder="Descrição">
              <div style="display:flex; gap:6px;">
                <select class="edit-select" id="edit-cat-${t.id}" onchange="onCategoriaSelectChange('${t.id}')">${catOptions}</select>
                <select class="edit-select" id="edit-metodo-${t.id}" onchange="onMetodoSelectChange('${t.id}')">${metodoOptions}</select>
                <input class="edit-input" id="edit-valor-${t.id}" type="number" step="0.01" value="${Number(t.valor) || 0}" style="max-width:100px;">
              </div>
              <input class="edit-input" id="edit-cat-custom-${t.id}" type="text"
                placeholder="Nome da nova categoria"
                value="${!catAtualConhecida ? (t.categoria || "").replace(/"/g, "&quot;") : ""}"
                style="display:${!catAtualConhecida ? "block" : "none"};">
              <input class="edit-input" id="edit-metodo-custom-${t.id}" type="text"
                placeholder="Nome do novo método (ex: Cartão Mãe, V.A)"
                value="${!metodoAtualConhecido ? metodoAtual.replace(/"/g, "&quot;") : ""}"
                style="display:${!metodoAtualConhecido ? "block" : "none"};">
              <div class="edit-actions">
                <button class="btn-cancelar" onclick="cancelarEdicao()">Cancelar</button>
                <button class="btn-salvar" onclick="salvarEdicao('${t.id}')">Salvar</button>
              </div>
            </td>
          </tr>`;
      }

      window.onCategoriaSelectChange = function (id) {
        const sel = document.getElementById(`edit-cat-${id}`);
        const customEl = document.getElementById(`edit-cat-custom-${id}`);
        const isCustom = sel.value === "__custom__";
        customEl.style.display = isCustom ? "block" : "none";
        if (isCustom) customEl.focus();
      };

      window.onMetodoSelectChange = function (id) {
        const sel = document.getElementById(`edit-metodo-${id}`);
        const customEl = document.getElementById(`edit-metodo-custom-${id}`);
        const isCustom = sel.value === "__custom__";
        customEl.style.display = isCustom ? "block" : "none";
        if (isCustom) customEl.focus();
      };

      window.iniciarEdicao = function (id) {
        editingId = id;
        renderTudo(ultimasTransacoes);
      };

      window.cancelarEdicao = function () {
        editingId = null;
        renderTudo(ultimasTransacoes);
      };

      window.salvarEdicao = async function (id) {
        const descricao = document.getElementById(`edit-desc-${id}`).value.trim();
        const catSelecionada = document.getElementById(`edit-cat-${id}`).value;
        const categoria = catSelecionada === "__custom__"
          ? (document.getElementById(`edit-cat-custom-${id}`).value.trim() || "Outros")
          : catSelecionada;
        const metodoSelecionado = document.getElementById(`edit-metodo-${id}`).value;
        const metodo = metodoSelecionado === "__custom__"
          ? (document.getElementById(`edit-metodo-custom-${id}`).value.trim() || "indefinido")
          : metodoSelecionado;
        const valor = parseFloat(document.getElementById(`edit-valor-${id}`).value) || 0;
        try {
          await updateDoc(doc(db, "transacoes", id), { descricao, categoria, metodo, valor });
          editingId = null; // o onSnapshot já vai re-renderizar sozinho com o dado novo
        } catch (e) {
          console.error("Erro ao salvar:", e);
          alert("Não consegui salvar. Confere se as Regras do Firestore liberam update.");
        }
      };

      window.excluirTransacao = async function (id) {
        if (!confirm("Excluir essa transação?")) return;
        try {
          await deleteDoc(doc(db, "transacoes", id));
        } catch (e) {
          console.error("Erro ao excluir:", e);
          alert("Não consegui excluir. Confere se as Regras do Firestore liberam delete.");
        }
      };

      // ── ÚLTIMOS 3 MESES ──
      function mesLabel(date) {
        const label = date.toLocaleDateString("pt-BR", { month: "long" });
        return label.charAt(0).toUpperCase() + label.slice(1);
      }

      function computeUltimosMeses(transacoes, n = 3) {
        const hoje = new Date();
        const meses = [];
        for (let i = n - 1; i >= 0; i--) {
          const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
          meses.push({ key: `${d.getFullYear()}-${d.getMonth()}`, label: mesLabel(d), total: 0, categorias: {} });
        }
        const porChave = Object.fromEntries(meses.map((m) => [m.key, m]));

        transacoes.forEach((t) => {
          if (!t.data || !t.data.toDate) return;
          const d = t.data.toDate();
          const key = `${d.getFullYear()}-${d.getMonth()}`;
          const mes = porChave[key];
          if (!mes) return;
          const valor = Number(t.valor) || 0;
          const cat = t.categoria || "Outros";
          mes.total += valor;
          mes.categorias[cat] = (mes.categorias[cat] || 0) + valor;
        });

        meses.forEach((m) => {
          const entries = Object.entries(m.categorias).sort((a, b) => b[1] - a[1]);
          m.topCategoria = entries.length ? entries[0][0] : null;
          m.topValor = entries.length ? entries[0][1] : 0;
        });
        return meses;
      }

      function atualizarOpcoesFiltroMes() {
        const sel = document.getElementById("mes-cat-filter");
        const atual = sel.value;
        const opcoes = categoriasConhecidas();
        sel.innerHTML =
          `<option value="">Categoria mais alta</option>` +
          opcoes.map((c) => `<option value="${c}" ${c === atual ? "selected" : ""}>${c}</option>`).join("");
      }

      window.onMesFiltroChange = function () {
        renderMeses(ultimasSemCredito);
      };

      function renderMeses(transacoes) {
        atualizarOpcoesFiltroMes();
        const filtro = document.getElementById("mes-cat-filter").value;
        const meses = computeUltimosMeses(transacoes, 3);

        document.getElementById("lista-meses").innerHTML = meses
          .map((m) => {
            let nomeCat, valorCat;
            if (filtro) {
              nomeCat = filtro;
              valorCat = m.categorias[filtro] || 0;
            } else {
              nomeCat = m.topCategoria;
              valorCat = m.topValor;
            }

            const cor = nomeCat && valorCat > 0 ? corPara(nomeCat) : "#4b5563";
            const subLinha =
              nomeCat && valorCat > 0
                ? `<span class="mes-top-dot" style="background:${cor}"></span>${nomeCat}: R$ ${valorCat.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}`
                : filtro
                ? `Sem gastos em ${filtro}`
                : "Sem gastos";

            return `
              <div class="mes-row">
                <div class="mes-row-top">
                  <span class="mes-nome">${m.label}</span>
                  <span class="mes-total">R$ ${m.total.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}</span>
                </div>
                <div class="mes-top-cat">${subLinha}</div>
              </div>`;
          })
          .join("");
      }

      // ── RENDER GERAL ──
      function renderTudo(transacoes) {
        ultimasTransacoes = transacoes;
        // Métodos "diferidos" (crédito, cartão mãe) não contam nas somas/maior
        // gasto/últimos 3 meses — só "saem" de fato quando a fatura é paga.
        // Mas continuam aparecendo normalmente na tabela abaixo.
        const semCredito = transacoes.filter((t) => !METODOS_DIFERIDOS.includes(t.metodo));
        ultimasSemCredito = semCredito;
        const semCreditoPeriodo = filtrarPorPeriodo(semCredito, periodoFiltro);

        let totalGeral = 0;
        let catTotals = {};
        let metodoTotals = {};
        let html = "";

        transacoes.forEach((t, index) => {
          const valorNum = Number(t.valor) || 0;
          const m = t.metodo || "indefinido";
          metodoTotals[m] = (metodoTotals[m] || 0) + valorNum;
          if (index < 10) {
            html += editingId === t.id ? editRowHtml(t) : rowHtml(t);
          }
        });

        semCreditoPeriodo.forEach((t) => {
          const valorNum = Number(t.valor) || 0;
          const cat = t.categoria || "Outros";
          totalGeral += valorNum;
          catTotals[cat] = (catTotals[cat] || 0) + valorNum;
        });

        const rotuloPeriodo = PERIODO_LABEL[periodoFiltro] || "";
        document.getElementById("periodo-label-1").innerText = rotuloPeriodo;
        document.getElementById("periodo-label-2").innerText = rotuloPeriodo;
        const seletor = document.getElementById("periodo-filter");
        if (seletor.value !== periodoFiltro) seletor.value = periodoFiltro;

        if (!Object.keys(catTotals).length) {
          document.getElementById("top-cat-name").innerText = "SEM DADOS";
          document.getElementById("top-cat-value").innerText = "R$ 0,00";
        } else {
          const topCat = Object.keys(catTotals).reduce((a, b) => (catTotals[a] > catTotals[b] ? a : b));
          document.getElementById("top-cat-name").innerText = topCat.toUpperCase();
          document.getElementById("top-cat-value").innerText =
            `R$ ${catTotals[topCat].toLocaleString("pt-BR", { minimumFractionDigits: 2 })}`;
        }

        document.getElementById("lista-transacoes").innerHTML =
          html || `<tr><td colspan="4" style="text-align:center;color:#8b949e;padding:20px;">Nenhuma transação ainda</td></tr>`;
        document.getElementById("gasto-total").innerText =
          `R$ ${totalGeral.toLocaleString("pt-BR", { minimumFractionDigits: 2 })}`;

        renderMeses(semCredito);
        renderChart(catTotals, totalGeral);
        renderMetodoChart(metodoTotals);

        setTimeout(() => {
          const height = document.getElementById("content-wrapper").offsetHeight;
          window.parent.postMessage({ height: height, id: frameId }, "*");
        }, 150);
      }

      function renderChart(dataObj, totalGeral) {
        const ctx = document.getElementById("financeChart").getContext("2d");
        if (window.chartInst) window.chartInst.destroy();

        const labels = Object.keys(dataObj);
        const colors = labels.map((l) => corPara(l));

        window.chartInst = new Chart(ctx, {
          type: "doughnut",
          plugins: [ChartDataLabels],
          data: {
            labels: labels,
            datasets: [{ data: Object.values(dataObj), backgroundColor: colors, borderWidth: 2, borderColor: "#161b22", hoverOffset: 15 }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: !isCompact,
                position: "bottom",
                labels: { color: "#8b949e", font: { size: 10 }, usePointStyle: true, padding: 12 },
              },
              datalabels: {
                color: "#fff",
                font: { family: "Montserrat", weight: "bold", size: isCompact ? 8 : 10 },
                formatter: (value) => {
                  let p = ((value / totalGeral) * 100).toFixed(0);
                  return p > 6 ? p + "%" : "";
                },
              },
              tooltip: { callbacks: { label: (context) => ` ${context.label}: R$ ${context.parsed.toLocaleString("pt-BR")}` } },
            },
          },
        });
      }

      function renderMetodoChart(dataObj) {
        const canvas = document.getElementById("metodoChart");
        if (!canvas || isCompact) return; // só existe/renderiza no expandido
        const ctx = canvas.getContext("2d");
        if (window.chartMetodoInst) window.chartMetodoInst.destroy();

        const entries = Object.entries(dataObj).filter(([, v]) => v > 0);
        const labels = entries.map(([k]) => metodoLabel(k));
        const colors = entries.map(([k]) => corPara(k));
        const total = entries.reduce((a, [, v]) => a + v, 0);

        window.chartMetodoInst = new Chart(ctx, {
          type: "doughnut",
          plugins: [ChartDataLabels],
          data: { labels, datasets: [{ data: entries.map(([, v]) => v), backgroundColor: colors, borderWidth: 2, borderColor: "#161b22", hoverOffset: 12 }] },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: true, position: "bottom", labels: { color: "#8b949e", font: { size: 10 }, usePointStyle: true, padding: 10 } },
              datalabels: {
                color: "#fff",
                font: { family: "Montserrat", weight: "bold", size: 10 },
                formatter: (value) => (total ? ((value / total) * 100).toFixed(0) + "%" : ""),
              },
              tooltip: { callbacks: { label: (context) => ` ${context.label}: R$ ${context.parsed.toLocaleString("pt-BR")}` } },
            },
          },
        });
      }

      async function iniciar() {
        try {
          await signInAnonymously(auth);
        } catch (e) {
          console.error("Erro no login anônimo:", e);
          document.getElementById("top-cat-name").innerText = "ERRO DE LOGIN";
          return;
        }

        const q = query(collection(db, "transacoes"), orderBy("data", "desc"));
        onSnapshot(
          q,
          (snapshot) => {
            const transacoes = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderTudo(transacoes);
          },
          (err) => {
            console.error("Erro lendo Firestore:", err);
            document.getElementById("top-cat-name").innerText = "ERRO AO LER";
          }
        );
      }

      iniciar();
    </script>
  </body>
</html>
