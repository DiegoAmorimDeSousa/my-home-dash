<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <link rel="stylesheet" href="financas.css" />
  </head>
  <body>
    <script src="../../shared/compacto.js"></script>
    <div class="finance-module" id="content-wrapper">
      <div class="title-section">
        <h2><span style="color: var(--purple)">●</span> GESTÃO FINANCEIRA</h2>
      </div>

      <div class="tab-row full-only">
        <button class="tab-btn active" data-v="geral" onclick="mudarAba('geral')">Visão geral</button>
        <button class="tab-btn" data-v="contas" onclick="mudarAba('contas')">Contas do mês</button>
      </div>

      <div id="view-contas" class="full-only aba-oculta">
        <div class="orc-topo">
          <button class="mes-btn" onclick="orcMudarMes(-1)">◀</button>
          <span class="orc-mes-label" id="orc-mes-label"></span>
          <button class="mes-btn" id="orc-next" onclick="orcMudarMes(1)">▶</button>
        </div>
        <div id="orc-vazio" class="fin-card" style="display:none"></div>
        <div id="orc-corpo">
          <div class="orc-grid">
            <div class="fin-card">
              <div class="total-label" style="margin-bottom:12px">Salários e benefícios</div>
              <div class="orc-sal-grid" id="orc-salarios"></div>
            </div>
            <div class="fin-card">
              <div class="total-label" style="margin-bottom:12px">Resumo e reserva de emergência</div>
              <div id="orc-resumo"></div>
            </div>
          </div>
          <div class="fin-card">
            <div class="total-label" style="margin-bottom:10px">Contas do mês</div>
            <table class="orc-tabela">
              <thead><tr><th>Conta</th><th>Grupo</th><th>Quem paga</th><th>Valor</th><th></th></tr></thead>
              <tbody id="orc-contas-corpo"></tbody>
            </table>
            <div class="orc-novo">
              <input id="orc-novo-nome" class="edit-input" placeholder="Nova conta (ex: Condomínio)">
              <select id="orc-novo-grupo" class="edit-select"><option value="essencial">Essencial</option><option value="diverso">Diversos</option></select>
              <select id="orc-novo-resp" class="edit-select"><option value="proporcional">Dividir (proporcional)</option><option value="Diego">Diego</option><option value="Beatriz">Beatriz</option></select>
              <input id="orc-novo-valor" class="edit-input orc-num" type="number" step="0.01" placeholder="Valor">
              <button class="btn-roxo" onclick="orcAddConta()">Adicionar</button>
            </div>
          </div>
          <div class="orc-pagam" id="orc-pagam"></div>
        </div>
      </div>

      <div class="fin-grid" id="view-geral">
        <div class="col-left">
          <div class="highlight-card" id="top-expense-card">
            <div class="total-label">TOP 3 GASTOS <span id="periodo-label-1" style="opacity:0.7;"></span></div>
            <div class="top3" id="top3-list"></div>
          </div>

          <div class="fin-card mae-card" id="mae-card">
            <div>
              <div class="total-label">💳 Cartão Mãe <span id="periodo-label-3" style="opacity:0.7;"></span></div>
              <div class="mae-sub" id="mae-sub" style="text-align:left;margin-top:3px;"></div>
            </div>
            <div class="mae-valor" id="mae-valor">R$ 0,00</div>
          </div>

          <div class="fin-card mae-card" id="contas-card">
            <div class="total-label">📋 Contas do mês</div>
            <div class="contas-resumo" id="contas-resumo"></div>
          </div>

          <div class="fin-card" id="chart-card">
            <div class="total-header">
              <div class="total-label" style="display:flex; justify-content:space-between; align-items:center;">
                <span>Gastos Totais <span id="periodo-label-2" style="opacity:0.7;"></span></span>
                <select id="periodo-filter" class="mes-filter-select" onchange="onPeriodoChange()">
                  <option value="mes">Este Mês</option>
                  <option value="ano">Este Ano</option>
                  <option value="tudo">Tudo</option>
                </select>
              </div>
              <div id="gasto-total" class="total-value">R$ 0,00</div>
            </div>
            <div class="chart-container">
              <canvas id="financeChart"></canvas>
            </div>
          </div>

          <!-- Só no expandido: segundo gráfico, por método de pagamento -->
          <div class="fin-card full-only">
            <div class="total-label" style="margin-bottom: 10px;">Por Método de Pagamento</div>
            <div class="chart-container metodo">
              <canvas id="metodoChart"></canvas>
            </div>
          </div>

          <!-- Últimos 3 meses — aparece no compacto E no expandido -->
          <div class="fin-card" id="mes-card">
            <div class="total-label" style="margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <span>Últimos 3 Meses</span>
              <select id="mes-cat-filter" class="mes-filter-select" onchange="onMesFiltroChange()">
                <option value="">Categoria mais alta</option>
              </select>
            </div>
            <div class="mes-list" id="lista-meses"></div>
          </div>
        </div>

        <div class="col-right full-only">
          <div class="fin-card">
            <div class="charts-row">
              <div class="chart-box">
                <div class="total-label" id="dia-chart-titulo">Gasto por dia</div>
                <div class="bar-container"><canvas id="diaChart"></canvas></div>
                <div class="chart-note" id="dia-chart-nota"></div>
              </div>
              <div class="chart-box">
                <div class="total-label" id="mes-chart-titulo">Gasto por mês</div>
                <div class="bar-container"><canvas id="mesChart"></canvas></div>
                <div class="chart-note" id="mes-chart-nota"></div>
              </div>
            </div>
          </div>

          <div class="fin-card">
            <div class="total-label" style="margin-bottom: 12px; display:flex; justify-content:space-between;">
              <span>Movimentações</span>
              <span style="color: var(--purple); font-size: 0.6rem">ATUALIZADO AGORA</span>
            </div>
            <div class="filtros">
              <select id="f-mes" class="filtro-input" onchange="onFiltroChange()"></select>
              <select id="f-cat" class="filtro-input" onchange="onFiltroChange()"></select>
              <select id="f-metodo" class="filtro-input" onchange="onFiltroChange()"></select>
              <select id="f-dono" class="filtro-input" onchange="onFiltroChange()"></select>
              <input id="f-busca" class="filtro-input filtro-busca" type="text" placeholder="Buscar descrição…" oninput="onFiltroChange()">
              <button class="btn-limpar" onclick="limparFiltros()">Limpar</button>
            </div>
            <div class="lista-resumo" id="lista-resumo"></div>
            <div class="lista-scroll">
              <table>
                <tbody id="lista-transacoes"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
