<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Módulo de Futebol</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0b0e14;
        --card-bg: #161b22;
        --purple: #a855f7;
        --blue: #3b82f6;
        --green: #238636;
        --red: #da3633;
        --text-main: #ffffff;
        --text-dim: #8b949e;
        --border: #30363d;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 0;
      }

      /* ESTILIZAÇÃO DO SCROLLBAR GLOBAL DO MODULO (Para navegadores baseados em Webkit) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--purple);
      }

      /* Para Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--border) var(--bg);
      }

      #futebol-content {
        padding: 20px;
        box-sizing: border-box;
      }

      .module-header {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Montserrat", sans-serif;
        font-size: 1.2rem;
        color: var(--purple);
        margin-bottom: 20px;
        text-transform: uppercase;
      }

      .config-panel {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 25px;
        border: 1px solid var(--border);
      }
      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
      }
      .checkbox-grid label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.03);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        color: var(--text-dim);
        transition: 0.2s;
      }
      .checkbox-grid label:hover {
        background: rgba(168, 85, 247, 0.1);
        color: #fff;
      }
      .checkbox-grid input {
        width: 16px;
        height: 16px;
        accent-color: var(--purple);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
        margin-bottom: 25px;
      }
      .stat-card {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 14px;
        text-align: center;
        border: 1px solid var(--border);
        border-bottom: 4px solid var(--purple);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .stat-card.hidden {
        display: none !important;
      }
      .stat-img {
        width: 45px;
        height: 45px;
        margin-bottom: 10px;
        object-fit: contain;
      }
      .stat-val {
        font-family: "Montserrat", sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        display: block;
        margin-top: 5px;
      }
      .stat-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-dim);
        font-weight: 700;
        letter-spacing: 1px;
      }
      .stat-time {
        font-size: 0.7rem;
        color: var(--purple);
        font-weight: 600;
        margin-top: 4px;
      }

      .card-table {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 20px;
        border: 1px solid var(--border);
        overflow-x: auto;
        margin-bottom: 40px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        min-width: 850px;
      }
      th {
        text-align: left;
        color: var(--text-dim);
        padding: 12px;
        border-bottom: 2px solid var(--border);
        font-size: 0.7rem;
        text-transform: uppercase;
      }
      td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }
      .pos-1 {
        color: #00ff88;
        font-weight: 800;
        font-size: 1.1rem;
      }
      .pos-g6 {
        color: var(--blue);
        font-weight: 700;
      }
      .pos-z6 {
        color: var(--red);
        font-weight: 700;
      }
      .team-cell {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .team-logo {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .bold {
        font-weight: 800;
        color: #fff;
      }

      /* MATA-MATA ESPELHADO PROFISSIONAL */
      .tournament-wrapper {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        align-items: center;
        background: rgba(255, 255, 255, 0.01);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid var(--border);
        overflow-x: auto;
        min-width: 1150px;
      }

      .bracket-side {
        display: flex;
        gap: 30px;
        align-items: center;
      }

      .bracket-side.left {
        justify-content: flex-start;
      }
      .bracket-side.right {
        justify-content: flex-end;
        flex-direction: row-reverse;
      }

      .bracket-round {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        height: 680px;
        min-width: 210px;
      }

      .center-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 260px;
        gap: 40px;
        padding: 0 10px;
      }

      .round-title-node {
        font-family: "Montserrat", sans-serif;
        font-size: 0.7rem;
        color: var(--text-dim);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        margin-bottom: 8px;
      }

      .matchup {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        position: relative;
      }

      .matchup-team {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8rem;
        color: var(--text-dim);
        height: 28px;
      }

      .matchup-team.winner {
        color: #00ff88;
        font-weight: 700;
      }

      .team-info-block {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .bracket-logo {
        width: 20px;
        height: 20px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .scores-display {
        display: flex;
        gap: 4px;
      }

      .score-box {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.75rem;
        min-width: 16px;
        text-align: center;
        color: var(--text-main);
        font-weight: 600;
      }

      /* Estilo para a caixinha de pênaltis / desempate */
      .score-box.penalty-box {
        background: var(--purple);
        color: #fff;
        border-color: var(--purple);
        font-size: 0.65rem;
        font-weight: 700;
      }

      .btn-action {
        background: var(--purple);
        color: #fff;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 0.8rem;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-action:hover {
        opacity: 0.9;
        transform: scale(1.02);
      }

      .filter-buttons-container {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 20px 0;
        padding: 0 5px;
      }

      /* Estilo base dos botões seguindo a identidade da sua página */
      .btn-filter {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 0.85rem;
        color: #000000;
        background-color: var(--purple);
        border: 2px solid var(--purple);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
      }

      /* Efeito Hover (passar o mouse por cima) - clareia levemente e expande */
      .btn-filter:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
      }

      /* Estado Ativo (Botão Selecionado) - Ganha borda brilhante e sombra Neon roxa */
      .btn-filter.active {
        background-color: var(--purple);
        color: #ffffff;
        border-color: #ffffff;
        box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
      }

      .add-time-form {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 20px;
        align-items: center;
      }
      .add-time-input, .add-time-select {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        font-size: 0.85rem;
        padding: 8px 10px;
      }
      .add-time-input { flex: 1; min-width: 160px; }
      .btn-cancel-time {
        background: rgba(255,255,255,0.06);
        color: var(--text-dim);
        border: none;
        font-family: "Inter", sans-serif;
        font-size: 0.8rem;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
      }

      .hall-of-fame {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
        margin-bottom: 40px;
      }
      .season-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        border-bottom: 3px solid gold;
      }
      .season-year {
        font-family: "Montserrat", sans-serif;
        font-size: 1.3rem;
        font-weight: 800;
        color: gold;
      }
      .season-champion {
        margin: 8px 0 12px;
        font-size: 0.95rem;
      }
      .season-champion b { color: #fff; }
      .season-divisoes {
        font-size: 0.75rem;
        color: var(--text-dim);
        line-height: 1.6;
      }
      .season-recorde {
        font-size: 0.72rem;
        color: var(--text-dim);
        margin-top: 3px;
      }

      /* ── MODO COMPACTO: esconde tudo que não é a tabela ── */
      body.is-compact .full-only {
        display: none !important;
      }

      /* ── MODO COMPACTO (resumo) ── */
      html, body.is-compact { height: 100%; }
      body.is-compact #futebol-content {
        padding: 10px 14px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      body.is-compact .module-header { font-size: 0.95rem; margin-bottom: 10px; flex-shrink: 0; }
      body.is-compact .config-panel,
      body.is-compact .stats-grid,
      body.is-compact .filter-buttons-container,
      body.is-compact #bracket-section,
      body.is-compact #bracket-header,
      body.is-compact .tournament-wrapper,
      body.is-compact .btn-action {
        display: none !important;
      }
      body.is-compact .card-table {
        margin-bottom: 0;
        padding: 10px;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      body.is-compact table {
        min-width: 0;
      }
      body.is-compact thead th { position: sticky; top: 0; background: var(--card-bg); z-index: 1; }
      /* Mantém #, tendência, Time e P — esconde só o resto (J,V,E,D,GM,GS,SG,%,Últimos Jogos) */
      body.is-compact th:nth-child(n + 5),
      body.is-compact td:nth-child(n + 5) {
        display: none;
      }
      body.is-compact th,
      body.is-compact td {
        padding: 8px 10px;
      }
    </style>
  </head>
  <body>
    <div id="futebol-content">
      <div class="module-header">
        <span>⚽ Tabela de Classificação</span>
      </div>

      <div class="config-panel full-only">
        <div class="checkbox-grid" id="filter-area"></div>
      </div>

      <div class="stats-grid full-only" id="cards-area"></div>

      <div class="filter-buttons-container full-only" id="filter-buttons-row">
        <button
          class="btn-filter active"
          onclick="mudarDivisao('Brasil', 'A', this)"
        >
          Brasil - A
        </button>
        <button class="btn-filter" onclick="mudarDivisao('Brasil', 'B', this)">
          Brasil - B
        </button>
        <button class="btn-filter" onclick="mudarDivisao('Mundo', 'A', this)">
          Mundo - A
        </button>
        <button class="btn-filter" onclick="mudarDivisao('Mundo', 'B', this)">
          Mundo - B
        </button>
        <button
          class="btn-filter"
          onclick="mudarDivisao('Todos', 'Todos', this)"
        >
          Todos
        </button>
        <button class="btn-filter" style="margin-left:auto;background:transparent;color:var(--purple);" onclick="toggleAddTimeForm()">
          + Adicionar Time
        </button>
      </div>

      <div class="add-time-form full-only" id="add-time-form" style="display:none">
        <input type="text" id="novo-time-nome" class="add-time-input" placeholder="Nome do time">
        <input type="text" id="novo-time-logo" class="add-time-input" placeholder="URL do escudo/logo">
        <select id="novo-time-pais" class="add-time-select">
          <option value="Brasil">Brasil</option>
          <option value="Mundo">Mundo</option>
        </select>
        <select id="novo-time-divisao" class="add-time-select">
          <option value="A">Divisão A</option>
          <option value="B">Divisão B</option>
        </select>
        <button class="btn-action" onclick="adicionarTimeUI()">Adicionar</button>
        <button class="btn-cancel-time" onclick="toggleAddTimeForm(false)">Cancelar</button>
      </div>

      <div class="card-table">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th></th>
              <th>Time</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GM</th>
              <th>GS</th>
              <th>SG</th>
              <th>%</th>
              <th>Últimos Jogos</th>
            </tr>
          </thead>
          <tbody id="futebol-body"></tbody>
        </table>
      </div>

      <div
        id="bracket-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 40px;
          margin-bottom: 20px;
        "
      >
        <div class="module-header" style="margin-bottom: 0">
          <span>🏆 Chaveamento Copa Mata-Mata (32 Times)</span>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn-action" style="background:var(--red);" onclick="encerrarTemporadaUI()">
            Encerrar Temporada
          </button>
          <button class="btn-action" onclick="iniciarNovoTorneio32()">
            Gerar Novo Chaveamento
          </button>
        </div>
      </div>

      <div class="tournament-wrapper" id="bracket-section">
        <div class="bracket-side left">
          <div class="bracket-round" id="round-left-32"></div>
          <div class="bracket-round" id="round-left-16"></div>
          <div class="bracket-round" id="round-left-8"></div>
          <div class="bracket-round" id="round-left-4"></div>
        </div>

        <div class="center-stage">
          <div
            id="round-center-final-title"
            class="round-title-node"
            style="margin-bottom: -25px"
          >
            GRANDE FINAL
          </div>
          <div id="round-center-final" style="width: 100%"></div>
          <div id="podium-area"></div>
        </div>

        <div class="bracket-side right">
          <div class="bracket-round" id="round-right-32"></div>
          <div class="bracket-round" id="round-right-16"></div>
          <div class="bracket-round" id="round-right-8"></div>
          <div class="bracket-round" id="round-right-4"></div>
        </div>
      </div>

      <div class="module-header full-only" style="margin-top: 40px;">
        <span>🏆 Salão dos Campeões</span>
      </div>
      <div class="hall-of-fame full-only" id="hall-of-fame">
        <div style="color:var(--text-dim); font-size:0.85rem;">Nenhuma temporada encerrada ainda.</div>
      </div>
    </div>

    <script type="module">
      const params = new URLSearchParams(location.search);
      const isCompact = params.get("compact") === "1";
      const frameId = params.get("frameId") || "frame-futebol";
      if (isCompact) document.body.classList.add("is-compact");

      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
      import {
        getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy,
      } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCbsu_WD-7L-elljYBJ0j1naGiSGCnhDbE",
        authDomain: "my-home-dash-b554d.firebaseapp.com",
        projectId: "my-home-dash-b554d",
        storageBucket: "my-home-dash-b554d.firebasestorage.app",
        messagingSenderId: "225507144407",
        appId: "1:225507144407:web:833b14e322dca4c8b23692",
      };
      const fbApp = initializeApp(firebaseConfig);
      const auth = getAuth(fbApp);
      const db = getFirestore(fbApp);

      // URL do Apps Script do futebol — só usada pra disparar as ações
      // administrativas (gerar chaveamento / encerrar temporada). A leitura
      // de dados agora é 100% Firestore, em tempo real.
      const url_macro_apps_script =
        "https://script.google.com/macros/s/AKfycbyzVZOl7vbrtlVtre_12NFn-UqkT0zAJuEN_u865x6gDMnY6jesiNTZ44thrlOqb6hoTw/exec";

      let logoDatabase = {};
      let typePAIS = "Brasil";
      let season = "A";
      let todosOsTimes = [];
      let todosConfrontos = [];

      function slugify(nome) {
        return nome
          .toString()
          .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/(^-|-$)/g, "");
      }

      const metrics = [
        { id: "v_max", label: "Mais Vitórias", campo: "vitorias", type: "max" },
        { id: "v_min", label: "Menos Vitórias", campo: "vitorias", type: "min" },
        { id: "e_max", label: "Mais Empates", campo: "empates", type: "max" },
        { id: "e_min", label: "Menos Empates", campo: "empates", type: "min" },
        { id: "d_max", label: "Mais Derrotas", campo: "derrotas", type: "max" },
        { id: "d_min", label: "Menos Derrotas", campo: "derrotas", type: "min" },
        { id: "gm_max", label: "Melhor Ataque", campo: "golsMarcados", type: "max" },
        { id: "gm_min", label: "Pior Ataque", campo: "golsMarcados", type: "min" },
        { id: "gs_min", label: "Melhor Defesa", campo: "golsSofridos", type: "min" },
        { id: "gs_max", label: "Pior Defesa", campo: "golsSofridos", type: "max" },
        { id: "sg_max", label: "Maior Saldo", campo: "saldoGols", type: "max" },
        { id: "sg_min", label: "Pior Saldo", campo: "saldoGols", type: "min" },
        { id: "ap_max", label: "Aproveitamento", campo: "aproveitamento", type: "max" },
        { id: "ap_min", label: "Pior Aproveitamento", campo: "aproveitamento", type: "min" },
        { id: "j_max", label: "Mais Jogos", campo: "jogos", type: "max" },
        { id: "j_min", label: "Menos Jogos", campo: "jogos", type: "min" },
      ];

      window.mudarDivisao = function (pais, divisao, elementoClicado) {
        document.querySelectorAll(".btn-filter").forEach((btn) => btn.classList.remove("active"));
        elementoClicado.classList.add("active");
        typePAIS = pais;
        season = divisao;
        renderTabela();
      };

      function renderTabela() {
        const tbody = document.getElementById("futebol-body");
        if (!tbody) return;

        let results = {};
        metrics.forEach((m) => { results[m.id] = { val: m.type === "max" ? -Infinity : Infinity }; });

        let filtrados = todosOsTimes.filter((t) => {
          if (season === "Todos") return true;
          return t.pais === typePAIS && t.divisao === season;
        });
        filtrados.sort((a, b) => {
          if ((b.pontos || 0) !== (a.pontos || 0)) return (b.pontos || 0) - (a.pontos || 0);
          if ((b.saldoGols || 0) !== (a.saldoGols || 0)) return (b.saldoGols || 0) - (a.saldoGols || 0);
          return (b.golsMarcados || 0) - (a.golsMarcados || 0);
        });

        let html = "";
        filtrados.forEach((t, i) => {
          logoDatabase[t.nome] = t.logo || "";
          const pos = i + 1;

          let trendIcon = "";
          if (t.tendencia === "sobe") {
            const dif = (t.posicaoAnterior || pos) - pos;
            trendIcon = `<span style="color:#00ff88;font-size:0.75rem;font-weight:bold;">▲${dif > 0 ? dif : ""}</span>`;
          } else if (t.tendencia === "desce") {
            const dif = pos - (t.posicaoAnterior || pos);
            trendIcon = `<span style="color:var(--red);font-size:0.75rem;font-weight:bold;">▼${dif > 0 ? dif : ""}</span>`;
          } else if (t.tendencia === "igual" && (t.jogos || 0) > 0) {
            trendIcon = `<span style="color:var(--text-dim);font-size:0.75rem;">●</span>`;
          }

          const cl = pos === 1 ? "pos-1" : pos <= 6 ? "pos-g6" : pos > filtrados.length - 6 ? "pos-z6" : "";
          const pct = (t.aproveitamento || 0).toString().replace(".", ",");

          html += `
            <tr>
              <td class="${cl}">${pos}</td>
              <td style="width:25px;text-align:center;">${trendIcon}</td>
              <td><div class="team-cell"><img src="${t.logo || ""}" class="team-logo"><span>${t.nome}</span></div></td>
              <td class="bold">${t.pontos || 0}</td>
              <td>${t.jogos || 0}</td><td>${t.vitorias || 0}</td><td>${t.empates || 0}</td><td>${t.derrotas || 0}</td>
              <td>${t.golsMarcados || 0}</td><td>${t.golsSofridos || 0}</td><td>${t.saldoGols || 0}</td>
              <td style="color:var(--purple);font-weight:700">${pct}%</td>
              <td style="font-size:0.75rem;color:var(--text-dim);font-weight:500;">${t.ultimoPlacar || ""}</td>
            </tr>`;

          metrics.forEach((m) => {
            const v = Number(t[m.campo]) || 0;
            if ((m.type === "max" && v > results[m.id].val) || (m.type === "min" && v < results[m.id].val)) {
              results[m.id] = { val: v, time: t.nome, logo: t.logo || "", isPct: m.campo === "aproveitamento" };
            }
          });
        });

        tbody.innerHTML = html || `<tr><td colspan="13" style="text-align:center;color:var(--text-dim);padding:20px;">Nenhum time cadastrado nessa divisão ainda.</td></tr>`;
        renderDashboard(results);
        sendHeight();
      }

      function renderDashboard(results) {
        const fArea = document.getElementById("filter-area");
        const cArea = document.getElementById("cards-area");
        if (!fArea || !cArea) return;
        fArea.innerHTML = "";
        cArea.innerHTML = "";

        metrics.forEach((m) => {
          const d = results[m.id];
          if (!d || !d.time) return;
          fArea.innerHTML += `<label><input type="checkbox" checked onchange="toggleCard('${m.id}')"> ${m.label}</label>`;
          cArea.innerHTML += `
          <div class="stat-card" id="card-${m.id}">
              <span class="stat-label">${m.label}</span>
              <img src="${d.logo}" class="stat-img">
              <span class="stat-val">${d.val}${d.isPct ? "%" : ""}</span>
              <span class="stat-time">${d.time}</span>
          </div>`;
        });
      }

      window.toggleCard = function (id) {
        const card = document.getElementById(`card-${id}`);
        if (card) card.classList.toggle("hidden");
        sendHeight();
      };

      // ── ADICIONAR TIME ──
      window.toggleAddTimeForm = function (show) {
        const form = document.getElementById("add-time-form");
        const willShow = show !== undefined ? show : form.style.display === "none";
        form.style.display = willShow ? "flex" : "none";
      };

      window.adicionarTimeUI = async function () {
        const nome = document.getElementById("novo-time-nome").value.trim();
        const logo = document.getElementById("novo-time-logo").value.trim();
        const pais = document.getElementById("novo-time-pais").value;
        const divisao = document.getElementById("novo-time-divisao").value;
        if (!nome) { alert("Digita o nome do time."); return; }

        try {
          await setDoc(doc(db, "times", slugify(nome)), {
            nome, logo, pais, divisao,
            pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0,
            golsMarcados: 0, golsSofridos: 0, saldoGols: 0, aproveitamento: 0,
            ultimoPlacar: "", posicaoAtual: 0, posicaoAnterior: 0, tendencia: "igual",
          });
          document.getElementById("novo-time-nome").value = "";
          document.getElementById("novo-time-logo").value = "";
          toggleAddTimeForm(false);
        } catch (e) {
          console.error("Erro ao adicionar time:", e);
          alert("Não consegui adicionar. Confere as Regras do Firestore pra coleção 'times'.");
        }
      };

      // ── AÇÕES ADMINISTRATIVAS (via Apps Script) ──
      window.iniciarNovoTorneio32 = async function () {
        if (!confirm("Deseja sortear um novo chaveamento de 32 times?")) return;
        try {
          await fetch(`${url_macro_apps_script}?action=gerar`);
          alert("Chaveamento gerado! Pode levar alguns segundos pra aparecer.");
        } catch (e) {
          alert("Erro ao gerar chaveamento: " + e.message);
        }
      };

      window.encerrarTemporadaUI = async function () {
        if (!confirm("Isso arquiva os campeões/recordes do ano, zera as estatísticas de todos os times e aplica promoção/rebaixamento (6 sobem / 6 descem). Não dá pra desfazer. Confirmar?")) return;
        try {
          const resp = await fetch(`${url_macro_apps_script}?action=encerrar`);
          const texto = await resp.text();
          alert(texto);
        } catch (e) {
          alert("Erro ao encerrar temporada: " + e.message);
        }
      };

      // ── CHAVEAMENTO (mata-mata) ──
      function renderBracket() {
        if (!todosConfrontos.length) return;

        const porFase = (fase) => todosConfrontos.filter((c) => c.fase === fase);
        distribuirFase("Fase de 32", porFase("Fase de 32"), "round-left-32", "round-right-32");
        distribuirFase("Oitavas", porFase("Oitavas"), "round-left-16", "round-right-16");
        distribuirFase("Quartas", porFase("Quartas"), "round-left-8", "round-right-8");
        distribuirFase("Semifinal", porFase("Semifinal"), "round-left-4", "round-right-4");

        const fin = porFase("Final");
        const areaFinal = document.getElementById("round-center-final");
        const areaPodio = document.getElementById("podium-area");
        if (areaFinal && fin.length > 0) {
          const c = fin[0];
          areaFinal.innerHTML = buildMatchHTML(c);
          if (c.vencedor) {
            areaPodio.innerHTML = `
              <div style="text-align:center; border:2px dashed #00ff88; padding:15px; border-radius:12px; background:rgba(0,255,136,0.03); margin-top: 15px;">
                <span style="font-size:0.65rem; display:block; color:var(--text-dim); font-weight:700; letter-spacing:1px;">🏆 CAMPEÃO</span>
                <span style="font-family:'Montserrat', sans-serif; font-size:1.1rem; display:block; font-weight:800; color:#00ff88; margin-top:5px;">${c.vencedor}</span>
              </div>`;
          } else {
            areaPodio.innerHTML = "";
          }
        }
        sendHeight();
      }

      function distribuirFase(nomeFase, lista, idEsq, idDir) {
        const containerEsq = document.getElementById(idEsq);
        const containerDir = document.getElementById(idDir);
        if (!containerEsq || !containerDir) return;

        lista.sort((a, b) => a.slot - b.slot);
        let htmlEsq = `<div class="round-title-node">${nomeFase}</div>`;
        let htmlDir = `<div class="round-title-node">${nomeFase}</div>`;
        const metade = Math.ceil(lista.length / 2);

        lista.forEach((c, index) => {
          if (index < metade) htmlEsq += buildMatchHTML(c);
          else htmlDir += buildMatchHTML(c);
        });
        containerEsq.innerHTML = htmlEsq;
        containerDir.innerHTML = htmlDir;
      }

      function buildMatchHTML(conf) {
        const t1 = conf.time1 || "Aguardando...";
        const t2 = conf.time2 || "Aguardando...";
        const logo1 = logoDatabase[t1] || "";
        const logo2 = logoDatabase[t2] || "";
        const imgTag1 = logo1 ? `<img src="${logo1}" class="bracket-logo">` : `<div style="width:20px"></div>`;
        const imgTag2 = logo2 ? `<img src="${logo2}" class="bracket-logo">` : `<div style="width:20px"></div>`;

        const total1 = (Number(conf.ida1) || 0) + (Number(conf.volta1) || 0);
        const total2 = (Number(conf.ida2) || 0) + (Number(conf.volta2) || 0);
        const ambosCompletos = (conf.pernas1 || 0) === 2 && (conf.pernas2 || 0) === 2;
        const houveEmpateAgregado = ambosCompletos && total1 === total2;

        const renderTimeLinha = (nome, logoTag, ida, volta, souTime1) => {
          const isWinner = conf.vencedor === nome && nome !== "Aguardando...";
          const validIda = ida !== undefined && ida !== null && ida !== "" ? ida : "-";
          const validVolta = volta !== undefined && volta !== null && volta !== "" ? volta : "-";
          return `
          <div class="matchup-team ${isWinner ? "winner" : ""}">
            <div class="team-info-block">
              ${logoTag}
              <span style="${nome === "Aguardando..." ? "opacity:0.3" : ""}">${nome}</span>
            </div>
            ${nome !== "Aguardando..." ? `
              <div class="scores-display">
                <div class="score-box">${validIda}</div>
                <div class="score-box">${validVolta}</div>
                ${houveEmpateAgregado ? `<div class="score-box penalty-box">${souTime1 ? total1 : total2}</div>` : ""}
              </div>` : ""}
          </div>`;
        };

        return `
        <div class="matchup">
          ${renderTimeLinha(t1, imgTag1, conf.ida1, conf.volta1, true)}
          <div style="height:1px; background:var(--border); margin:1px 0;"></div>
          ${renderTimeLinha(t2, imgTag2, conf.ida2, conf.volta2, false)}
        </div>`;
      }

      // ── SALÃO DOS CAMPEÕES ──
      function renderHallOfFame(temporadas) {
        const el = document.getElementById("hall-of-fame");
        if (!el) return;
        if (!temporadas.length) {
          el.innerHTML = `<div style="color:var(--text-dim);font-size:0.85rem;">Nenhuma temporada encerrada ainda.</div>`;
          return;
        }
        el.innerHTML = temporadas.map((s) => {
          const divisoes = Object.entries(s.campeoesPorDivisao || {})
            .map(([chave, time]) => `${chave}: <b style="color:#fff">${time}</b>`)
            .join("<br>");
          const recordesTop = Object.values(s.recordes || {}).slice(0, 3)
            .map((r) => `${r.label}: ${r.time} (${r.valor})`)
            .join(" · ");
          return `
            <div class="season-card">
              <div class="season-year">${s.ano}</div>
              <div class="season-champion">🏆 Campeão Geral: <b>${s.campeaoGeral}</b></div>
              <div class="season-divisoes">${divisoes}</div>
              <div class="season-recorde">${recordesTop}</div>
            </div>`;
        }).join("");
        sendHeight();
      }

      function sendHeight() {
        setTimeout(() => {
          const el = document.getElementById("futebol-content");
          if (!el) return;
          window.parent.postMessage({ height: el.scrollHeight, id: frameId }, "*");
        }, 200);
      }

      // ── INICIALIZAÇÃO ──
      async function iniciar() {
        try {
          await signInAnonymously(auth);
        } catch (e) {
          console.error("Erro no login anônimo:", e);
          return;
        }

        onSnapshot(collection(db, "times"), (snapshot) => {
          todosOsTimes = snapshot.docs.map((d) => d.data());
          renderTabela();
          renderBracket(); // logos podem ter mudado
        });

        onSnapshot(collection(db, "matamata"), (snapshot) => {
          todosConfrontos = snapshot.docs.map((d) => d.data());
          renderBracket();
        });

        onSnapshot(query(collection(db, "temporadas"), orderBy("ano", "desc")), (snapshot) => {
          renderHallOfFame(snapshot.docs.map((d) => d.data()));
        });
      }

      iniciar();
    </script>
  </body>
</html>
