<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Módulo de Futebol</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0b0e14;
        --card-bg: #161b22;
        --purple: #a855f7;
        --blue: #3b82f6;
        --green: #238636;
        --red: #da3633;
        --text-main: #ffffff;
        --text-dim: #8b949e;
        --border: #30363d;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 0;
      }

      /* ESTILIZAÇÃO DO SCROLLBAR GLOBAL DO MODULO (Para navegadores baseados em Webkit) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--purple);
      }

      /* Para Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--border) var(--bg);
      }

      #futebol-content {
        padding: 20px;
        box-sizing: border-box;
      }

      .module-header {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Montserrat", sans-serif;
        font-size: 1.2rem;
        color: var(--purple);
        margin-bottom: 20px;
        text-transform: uppercase;
      }

      .config-panel {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 25px;
        border: 1px solid var(--border);
      }
      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
      }
      .checkbox-grid label {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.03);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        color: var(--text-dim);
        transition: 0.2s;
      }
      .checkbox-grid label:hover {
        background: rgba(168, 85, 247, 0.1);
        color: #fff;
      }
      .checkbox-grid input {
        width: 16px;
        height: 16px;
        accent-color: var(--purple);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
        margin-bottom: 25px;
      }
      .stat-card {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 14px;
        text-align: center;
        border: 1px solid var(--border);
        border-bottom: 4px solid var(--purple);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .stat-card.hidden {
        display: none !important;
      }
      .stat-img {
        width: 45px;
        height: 45px;
        margin-bottom: 10px;
        object-fit: contain;
      }
      .stat-val {
        font-family: "Montserrat", sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        display: block;
        margin-top: 5px;
      }
      .stat-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        color: var(--text-dim);
        font-weight: 700;
        letter-spacing: 1px;
      }
      .stat-time {
        font-size: 0.7rem;
        color: var(--purple);
        font-weight: 600;
        margin-top: 4px;
      }

      .card-table {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 20px;
        border: 1px solid var(--border);
        overflow-x: auto;
        margin-bottom: 40px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        min-width: 850px;
      }
      th {
        text-align: left;
        color: var(--text-dim);
        padding: 12px;
        border-bottom: 2px solid var(--border);
        font-size: 0.7rem;
        text-transform: uppercase;
      }
      td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }
      .pos-1 {
        color: #00ff88;
        font-weight: 800;
        font-size: 1.1rem;
      }
      .pos-g6 {
        color: var(--blue);
        font-weight: 700;
      }
      .pos-z6 {
        color: var(--red);
        font-weight: 700;
      }
      .team-cell {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .team-logo {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .bold {
        font-weight: 800;
        color: #fff;
      }

      /* MATA-MATA ESPELHADO PROFISSIONAL */
      .tournament-wrapper {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        align-items: center;
        background: rgba(255, 255, 255, 0.01);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid var(--border);
        overflow-x: auto;
        min-width: 1150px;
      }

      .bracket-side {
        display: flex;
        gap: 30px;
        align-items: center;
      }

      .bracket-side.left {
        justify-content: flex-start;
      }
      .bracket-side.right {
        justify-content: flex-end;
        flex-direction: row-reverse;
      }

      .bracket-round {
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        height: 680px;
        min-width: 210px;
      }

      .center-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 260px;
        gap: 40px;
        padding: 0 10px;
      }

      .round-title-node {
        font-family: "Montserrat", sans-serif;
        font-size: 0.7rem;
        color: var(--text-dim);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        margin-bottom: 8px;
      }

      .matchup {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        position: relative;
      }

      .matchup-team {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8rem;
        color: var(--text-dim);
        height: 28px;
      }

      .matchup-team.winner {
        color: #00ff88;
        font-weight: 700;
      }

      .team-info-block {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .bracket-logo {
        width: 20px;
        height: 20px;
        object-fit: contain;
        flex-shrink: 0;
      }

      .scores-display {
        display: flex;
        gap: 4px;
      }

      .score-box {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.75rem;
        min-width: 16px;
        text-align: center;
        color: var(--text-main);
        font-weight: 600;
      }

      /* Estilo para a caixinha de pênaltis / desempate */
      .score-box.penalty-box {
        background: var(--purple);
        color: #fff;
        border-color: var(--purple);
        font-size: 0.65rem;
        font-weight: 700;
      }

      .btn-action {
        background: var(--purple);
        color: #fff;
        font-family: "Inter", sans-serif;
        font-weight: 600;
        font-size: 0.8rem;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-action:hover {
        opacity: 0.9;
        transform: scale(1.02);
      }

      .filter-buttons-container {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 20px 0;
        padding: 0 5px;
      }

      /* Estilo base dos botões seguindo a identidade da sua página */
      .btn-filter {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 0.85rem;
        color: #000000;
        background-color: var(--purple);
        border: 2px solid var(--purple);
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
      }

      /* Efeito Hover (passar o mouse por cima) - clareia levemente e expande */
      .btn-filter:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
      }

      /* Estado Ativo (Botão Selecionado) - Ganha borda brilhante e sombra Neon roxa */
      .btn-filter.active {
        background-color: var(--purple);
        color: #ffffff;
        border-color: #ffffff;
        box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
      }

      /* ── MODO COMPACTO (resumo) ── */
      html, body.is-compact { height: 100%; }
      body.is-compact #futebol-content {
        padding: 10px 14px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      body.is-compact .module-header { font-size: 0.95rem; margin-bottom: 10px; flex-shrink: 0; }
      body.is-compact .config-panel,
      body.is-compact .stats-grid,
      body.is-compact .filter-buttons-container,
      body.is-compact #bracket-section,
      body.is-compact #bracket-header {
        display: none;
      }
      body.is-compact .card-table {
        margin-bottom: 0;
        padding: 10px;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      body.is-compact table {
        min-width: 0;
      }
      body.is-compact thead th { position: sticky; top: 0; background: var(--card-bg); z-index: 1; }
      body.is-compact th:nth-child(2),
      body.is-compact td:nth-child(2),
      body.is-compact th:nth-child(n + 5),
      body.is-compact td:nth-child(n + 5) {
        display: none;
      }
      body.is-compact th,
      body.is-compact td {
        padding: 8px 10px;
      }
    </style>
  </head>
  <body>
    <div id="futebol-content">
      <div class="module-header">
        <span>⚽ Tabela de Classificação</span>
      </div>

      <div class="config-panel">
        <div class="checkbox-grid" id="filter-area"></div>
      </div>

      <div class="stats-grid" id="cards-area"></div>

      <div class="filter-buttons-container">
        <button
          class="btn-filter active"
          onclick="mudarDivisao('Brasil', 'A', this)"
        >
          Brasil - A
        </button>
        <button class="btn-filter" onclick="mudarDivisao('Brasil', 'B', this)">
          Brasil - B
        </button>
        <button class="btn-filter" onclick="mudarDivisao('Mundo', 'A', this)">
          Mundo - A
        </button>
        <button class="btn-filter" onclick="mudarDivisao('Mundo', 'B', this)">
          Mundo - B
        </button>
        <button
          class="btn-filter"
          onclick="mudarDivisao('Todos', 'Todos', this)"
        >
          Todos
        </button>
      </div>

      <div class="card-table">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th></th>
              <th>Time</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GM</th>
              <th>GS</th>
              <th>SG</th>
              <th>%</th>
              <th>Últimos Jogos</th>
            </tr>
          </thead>
          <tbody id="futebol-body"></tbody>
        </table>
      </div>

      <div
        id="bracket-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-top: 40px;
          margin-bottom: 20px;
        "
      >
        <div class="module-header" style="margin-bottom: 0">
          <span>🏆 Chaveamento Copa Mata-Mata (32 Times)</span>
        </div>
        <button class="btn-action" onclick="iniciarNovoTorneio32()">
          Gerar Novo Chaveamento
        </button>
      </div>

      <div class="tournament-wrapper" id="bracket-section">
        <div class="bracket-side left">
          <div class="bracket-round" id="round-left-32"></div>
          <div class="bracket-round" id="round-left-16"></div>
          <div class="bracket-round" id="round-left-8"></div>
          <div class="bracket-round" id="round-left-4"></div>
        </div>

        <div class="center-stage">
          <div
            id="round-center-final-title"
            class="round-title-node"
            style="margin-bottom: -25px"
          >
            GRANDE FINAL
          </div>
          <div id="round-center-final" style="width: 100%"></div>
          <div id="podium-area"></div>
        </div>

        <div class="bracket-side right">
          <div class="bracket-round" id="round-right-32"></div>
          <div class="bracket-round" id="round-right-16"></div>
          <div class="bracket-round" id="round-right-8"></div>
          <div class="bracket-round" id="round-right-4"></div>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const isCompact = params.get("compact") === "1";
      const frameId = params.get("frameId") || "frame-futebol";
      if (isCompact) document.body.classList.add("is-compact");

      const url_macro_apps_script =
        "https://script.google.com/macros/s/AKfycbyzVZOl7vbrtlVtre_12NFn-UqkT0zAJuEN_u865x6gDMnY6jesiNTZ44thrlOqb6hoTw/exec";
      const url_futebol =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTPYLZxLUF_-LbaTOC0lAuArsOgbduUo3VWqc2Q_ZSUvvrgV_xlnnzTCaUgh78k2yxbDyDdT18IKofI/pub?gid=0&single=true&output=csv";

      let logoDatabase = {};
      let typePAIS = "Brasil";
      let season = "A";

      const metrics = [
        {
          id: "v_max",
          label: "Mais Vitórias",
          col: 4,
          type: "max",
          active: true,
        },
        {
          id: "v_min",
          label: "Menos Vitórias",
          col: 4,
          type: "min",
          active: true,
        },
        {
          id: "e_max",
          label: "Mais Empates",
          col: 5,
          type: "max",
          active: true,
        },
        {
          id: "e_min",
          label: "Menos Empates",
          col: 5,
          type: "min",
          active: true,
        },
        {
          id: "d_max",
          label: "Mais Derrotas",
          col: 6,
          type: "max",
          active: true,
        },
        {
          id: "d_min",
          label: "Menos Derrotas",
          col: 6,
          type: "min",
          active: true,
        },
        {
          id: "gm_max",
          label: "Melhor Ataque",
          col: 7,
          type: "max",
          active: true,
        },
        {
          id: "gm_min",
          label: "Pior Ataque",
          col: 7,
          type: "min",
          active: true,
        },
        {
          id: "gs_min",
          label: "Melhor Defesa",
          col: 8,
          type: "min",
          active: true,
        },
        {
          id: "gs_max",
          label: "Pior Defesa",
          col: 8,
          type: "max",
          active: true,
        },
        {
          id: "sg_max",
          label: "Maior Saldo",
          col: 9,
          type: "max",
          active: true,
        },
        {
          id: "sg_min",
          label: "Pior Saldo",
          col: 9,
          type: "min",
          active: true,
        },
        {
          id: "ap_max",
          label: "Aproveitamento",
          col: 10,
          type: "max",
          active: true,
        },
        {
          id: "ap_min",
          label: "Pior Aproveitamento",
          col: 10,
          type: "min",
          active: true,
        },
        { id: "j_max", label: "Mais Jogos", col: 3, type: "max", active: true },
        {
          id: "j_min",
          label: "Menos Jogos",
          col: 3,
          type: "min",
          active: true,
        },
      ];

      function mudarDivisao(pais, divisao, elementoClicado) {
        document.querySelectorAll(".btn-filter").forEach((btn) => {
          btn.classList.remove("active");
        });

        elementoClicado.classList.add("active");

        typePAIS = pais;
        season = divisao;

        initFutebol();
      }

      async function initFutebol() {
        try {
          const resp = await fetch(url_futebol);
          const data = await resp.text();
          const rows = data
            .split("\n")
            .map((r) => r.split(","))
            .slice(1);

          const tbody = document.getElementById("futebol-body");
          if (!tbody) return;
          tbody.innerHTML = "";

          let results = {};
          metrics.forEach(
            (m) =>
              (results[m.id] = {
                val: m.type === "max" ? -Infinity : Infinity,
              }),
          );

          const newRows = rows.filter((row) => {
            if (season === "Todos") return row;
            return row && row[12] === typePAIS && row[13] === season;
          });

          newRows.forEach((cols, i) => {
            if (cols.length < 15) return;

            const logoUrl = cols[0] ? cols[0].trim() : "";
            const timeNome = cols[1] ? cols[1].trim() : "";
            if (timeNome) {
              logoDatabase[timeNome] = logoUrl;
            }

            const pos = i + 1;
            const posAnt = parseInt(cols[17]);
            let trendIcon = "";

            if (!isNaN(posAnt)) {
              const diferenca = posAnt - pos;
              if (diferenca > 0) {
                trendIcon = `<span style="color: #00ff88; font-size: 0.75rem; font-weight: bold;">▲${diferenca}</span>`;
              } else if (diferenca < 0) {
                trendIcon = `<span style="color: var(--red); font-size: 0.75rem; font-weight: bold;">▼${Math.abs(diferenca)}</span>`;
              } else {
                trendIcon = `<span style="color: var(--text-dim); font-size: 0.75rem;">●</span>`;
              }
            }

            let cl =
              pos === 1
                ? "pos-1"
                : pos <= 6
                  ? "pos-g6"
                  : pos > newRows.length - 6
                    ? "pos-z6"
                    : "";

            tbody.innerHTML += `
            <tr>
              <td class="${cl}">${pos}</td>
              <td style="width: 25px; text-align: center;">${trendIcon}</td>
              <td><div class="team-cell"><img src="${logoUrl}" class="team-logo"><span>${timeNome}</span></div></td>
              <td class="bold">${cols[2]}</td>
              <td>${cols[3]}</td><td>${cols[4]}</td><td>${cols[5]}</td><td>${cols[6]}</td>
              <td>${cols[7]}</td><td>${cols[8]}</td><td>${cols[9]}</td>
              <td style="color:var(--purple); font-weight:700">${cols[10]}</td>
              <td style="font-size:0.75rem; color:var(--text-dim); font-weight: 500;">${cols[14]}</td>
            </tr>`;

            metrics.forEach((m) => {
              let v =
                parseFloat(cols[m.col]?.replace("%", "").replace(",", ".")) ||
                0;
              if (
                (m.type === "max" && v > results[m.id].val) ||
                (m.type === "min" && v < results[m.id].val)
              ) {
                results[m.id] = {
                  val: v,
                  time: timeNome,
                  logo: logoUrl,
                  isPct: cols[m.col]?.includes("%"),
                };
              }
            });
          });

          renderDashboard(results);
          if (!isCompact) carregarEExibirMataMataDoSheets();
          else sendHeight();
        } catch (e) {
          console.error("Erro na carga do Futebol:", e);
        }
      }

      function renderDashboard(results) {
        const fArea = document.getElementById("filter-area");
        const cArea = document.getElementById("cards-area");
        if (!fArea || !cArea) return;

        fArea.innerHTML = "";
        cArea.innerHTML = "";

        metrics.forEach((m) => {
          const d = results[m.id];
          if (!d || !d.logo) return;

          fArea.innerHTML += `
          <label><input type="checkbox" ${m.active ? "checked" : ""} onchange="toggleCard('${m.id}')"> ${m.label}</label>
        `;

          cArea.innerHTML += `
          <div class="stat-card ${m.active ? "" : "hidden"}" id="card-${m.id}">
              <span class="stat-label">${m.label}</span>
              <img src="${d.logo}" class="stat-img">
              <span class="stat-val">${d.val}${d.isPct ? "%" : ""}</span>
              <span class="stat-time">${d.time}</span>
          </div>`;
        });
      }

      function toggleCard(id) {
        const card = document.getElementById(`card-${id}`);
        if (card) card.classList.toggle("hidden");
        sendHeight();
      }

      async function iniciarNovoTorneio32() {
        if (url_macro_apps_script === "SUA_URL_DO_WEB_APP_AQUI") {
          alert(
            "Configure a URL do seu Apps Script no arquivo para usar este recurso!",
          );
          return;
        }
        if (
          confirm(
            "Deseja sortear um novo chaveamento de 32 times direto na planilha?",
          )
        ) {
          await fetch(`${url_macro_apps_script}?action=gerar`);
          setTimeout(initFutebol, 1500);
        }
      }

      async function carregarEExibirMataMataDoSheets() {
        try {
          if (url_macro_apps_script === "SUA_URL_DO_WEB_APP_AQUI") return;

          const resp = await fetch(
            `${url_macro_apps_script}?t=${new Date().getTime()}`,
          );
          const confrontosBrutos = await resp.json();

          if (!confrontosBrutos || confrontosBrutos.length === 0) return;

          const f32 = confrontosBrutos.filter((r) => r[0] === "Fase de 32");
          const oit = confrontosBrutos.filter((r) => r[0] === "Oitavas");
          const qua = confrontosBrutos.filter((r) => r[0] === "Quartas");
          const sem = confrontosBrutos.filter((r) => r[0] === "Semifinal");
          const fin = confrontosBrutos.filter((r) => r[0] === "Final");

          distribuirFase("Fase de 32", f32, "round-left-32", "round-right-32");
          distribuirFase("Oitavas", oit, "round-left-16", "round-right-16");
          distribuirFase("Quartas", qua, "round-left-8", "round-right-8");
          distribuirFase("Semifinal", sem, "round-left-4", "round-right-4");

          const areaFinal = document.getElementById("round-center-final");
          const areaPodio = document.getElementById("podium-area");

          if (areaFinal && fin.length > 0) {
            const c = fin[0];
            const confObj = {
              t1: c[1] || "Aguardando...",
              t2: c[2] || "Aguardando...",
              ida1: c[3],
              ida2: c[4],
              volta1: c[5],
              volta2: c[6],
              vencedor: c[8] || "",
            };
            areaFinal.innerHTML = buildMatchHTML(confObj);

            if (c[8]) {
              areaPodio.innerHTML = `
              <div style="text-align:center; border:2px dashed #00ff88; padding:15px; border-radius:12px; background:rgba(0,255,136,0.03); margin-top: 15px;">
                <span style="font-size:0.65rem; display:block; color:var(--text-dim); font-weight:700; letter-spacing:1px;">🏆 CAMPEÃO</span>
                <span style="font-family:'Montserrat', sans-serif; font-size:1.1rem; display:block; font-weight:800; color:#00ff88; margin-top:5px;">${c[8]}</span>
              </div>`;
            } else {
              areaPodio.innerHTML = "";
            }
          }

          sendHeight();
        } catch (err) {
          console.error("Erro ao estruturar chaves do mata-mata:", err);
        }
      }

      function distribuirFase(
        nomeFase,
        listaConfrontos,
        idContainerEsquerdo,
        idContainerDireito,
      ) {
        const containerEsq = document.getElementById(idContainerEsquerdo);
        const containerDir = document.getElementById(idContainerDireito);

        if (!containerEsq || !containerDir) return;

        let htmlEsq = `<div class="round-title-node">${nomeFase}</div>`;
        let htmlDir = `<div class="round-title-node">${nomeFase}</div>`;

        const metade = Math.ceil(listaConfrontos.length / 2);

        listaConfrontos.forEach((c, index) => {
          const confObj = {
            t1: c[1] || "Aguardando...",
            t2: c[2] || "Aguardando...",
            ida1: c[3],
            ida2: c[4],
            volta1: c[5],
            volta2: c[6],
            vencedor: c[8] || "",
          };

          if (index < metade) {
            htmlEsq += buildMatchHTML(confObj);
          } else {
            htmlDir += buildMatchHTML(confObj);
          }
        });

        containerEsq.innerHTML = htmlEsq;
        containerDir.innerHTML = htmlDir;
      }

      function buildMatchHTML(conf) {
        const logo1 = logoDatabase[conf.t1] || "";
        const logo2 = logoDatabase[conf.t2] || "";

        const imgTag1 = logo1
          ? `<img src="${logo1}" class="bracket-logo">`
          : `<div style="width:20px"></div>`;
        const imgTag2 = logo2
          ? `<img src="${logo2}" class="bracket-logo">`
          : `<div style="width:20px"></div>`;

        // ANALISE E TRATAMENTO DE EMPATE NO AGREGADO DOS DOIS JOGOS
        const ida1Int = parseInt(conf.ida1);
        const ida2Int = parseInt(conf.ida2);
        const volta1Int = parseInt(conf.volta1);
        const volta2Int = parseInt(conf.volta2);

        let totalTime1 =
          (isNaN(ida1Int) ? 0 : ida1Int) + (isNaN(volta1Int) ? 0 : volta1Int);
        let totalTime2 =
          (isNaN(ida2Int) ? 0 : ida2Int) + (isNaN(volta2Int) ? 0 : volta2Int);

        // Só ativa a regra se ambos os jogos possuírem valores numéricos preenchidos
        const jogosConcluidos =
          !isNaN(ida1Int) &&
          !isNaN(ida2Int) &&
          !isNaN(volta1Int) &&
          !isNaN(volta2Int);
        const houveEmpateAgregado =
          jogosConcluidos && totalTime1 === totalTime2;

        const renderTimeLinha = (nome, logoTag, ida, volta, souTime1) => {
          const isWinner = conf.vencedor === nome && nome !== "Aguardando...";
          const validIda = ida !== undefined && ida !== "" ? ida : "-";
          const validVolta = volta !== undefined && volta !== "" ? volta : "-";

          return `
          <div class="matchup-team ${isWinner ? "winner" : ""}">
            <div class="team-info-block">
              ${logoTag}
              <span style="${nome === "Aguardando..." ? "opacity:0.3" : ""}">${nome}</span>
            </div>
            ${
              nome !== "Aguardando..."
                ? `
              <div class="scores-display">
                <div class="score-box">${validIda}</div>
                <div class="score-box">${validVolta}</div>
                ${houveEmpateAgregado ? `<div class="score-box penalty-box">${souTime1 ? totalTime1 : totalTime2}</div>` : ""}
              </div>
            `
                : ""
            }
          </div>`;
        };

        return `
        <div class="matchup">
          ${renderTimeLinha(conf.t1, imgTag1, conf.ida1, conf.volta1, true)}
          <div style="height:1px; background:var(--border); margin:1px 0;"></div>
          ${renderTimeLinha(conf.t2, imgTag2, conf.ida2, conf.volta2, false)}
        </div>`;
      }

      function sendHeight() {
        setTimeout(() => {
          const el = document.getElementById("futebol-content");
          if (!el) return;
          const height = el.scrollHeight;
          window.parent.postMessage(
            { height: height, id: frameId },
            "*",
          );
        }, 300);
      }

      initFutebol();
    </script>
  </body>
</html>
